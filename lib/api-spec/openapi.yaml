openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NFL Analytics Model API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: nfl
    description: Live NFL schedule and team data
  - name: dashboard
    description: Dashboard summaries and data freshness
  - name: settings
    description: User-operable model and sportsbook settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get the dashboard overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /data-health:
    get:
      operationId: getDataHealth
      tags: [dashboard]
      summary: Get freshness and availability for each data provider
      responses:
        "200":
          description: Data health status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataHealth"
  /admin/sleeper-identity-report:
    get:
      operationId: getSleeperIdentityReport
      tags: [dashboard]
      summary: Read the administrator-only Sleeper identity mapping report
      description: Returns immutable mapping coverage, classification totals, position coverage, all-team depth candidates, a deterministic validation sample, risks, suitability, and safety assertions. Provider diagnostics are never exposed through consumer APIs.
      responses:
        "200":
          description: Sleeper identity mapping and validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleeperIdentityReport"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /games:
    get:
      operationId: listGames
      tags: [nfl]
      summary: List NFL games for a season and week
      parameters:
        - name: season
          in: query
          required: false
          schema:
            type: integer
            minimum: 2020
        - name: week
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 22
      responses:
        "200":
          description: NFL games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
  /games/{gameId}:
    get:
      operationId: getGame
      tags: [nfl]
      summary: Get one game with current odds and model status
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Game not found
  /games/{gameId}/odds-history:
    get:
      operationId: getOddsHistory
      tags: [nfl]
      summary: Get immutable sportsbook line history for one game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Historical sportsbook observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsHistory"
        "404":
          description: Game not found
  /odds/capture:
    post:
      operationId: captureOdds
      tags: [dashboard]
      summary: Make one explicit Odds API capture
      description: Performs one server-side request only. It never polls or retries and never exposes the API key.
      responses:
        "200":
          description: Capture completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsCaptureResult"
        "502":
          description: Capture failed
  /odds/audit:
    get:
      operationId: listOddsAudits
      tags: [dashboard]
      summary: Read persisted per-event Odds API matching audits
      description: Returns parsed provider fields and matching diagnostics without raw payloads or keyed URLs.
      parameters:
        - name: requestId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [matched_saved, matched_post_kickoff_skipped, unmatched]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: Persisted per-event audits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OddsEventAudit"
  /data-sync/schedule:
    post:
      operationId: syncSchedule
      tags: [nfl]
      summary: Persist the current and next two exposed NFL weeks
      description: Performs an explicit ESPN schedule sync and only upserts games; it never deletes schedule history or calls the Odds API.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleSyncRequest"
      responses:
        "200":
          description: Schedule synchronization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSyncResult"
        "502":
          description: Schedule synchronization failed
  /features/pregame/health:
    get:
      operationId: getPregameFeatureHealth
      tags: [dashboard]
      summary: Read historical pregame feature coverage and limitations
      parameters:
        - name: featureVersion
          in: query
          required: false
          schema: { type: string, enum: [pregame-v3, pregame-v4-personnel-context] }
      responses:
        "200":
          description: Feature definition and generated row counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PregameFeatureHealth"
  /features/pregame/game/{gameId}:
    get:
      operationId: getPregameFeaturesForGame
      tags: [nfl]
      summary: Read versioned pregame features for one game
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Team-level pregame feature rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PregameFeatureRow"
  /features/audit:
    get:
      operationId: listPregameFeatureAudit
      tags: [dashboard]
      summary: Read feature values and point-in-time source audit metadata
      parameters:
        - name: season
          in: query
          required: false
          schema: { type: integer }
        - name: week
          in: query
          required: false
          schema: { type: integer }
        - name: gameId
          in: query
          required: false
          schema: { type: string }
        - name: teamId
          in: query
          required: false
          schema: { type: string }
        - name: featureVersion
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Filtered feature audit rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PregameFeatureAuditRow"
  /features/live-input-integrity:
    get:
      operationId: getLiveModelInputIntegrity
      summary: Audit exact upcoming-game inputs for active production models
      responses:
        "200":
          description: Upcoming live model input integrity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelInputIntegrityAudit"
  /features/pregame/build:
    post:
      operationId: buildPregameFeatures
      tags: [dashboard]
      summary: Build an immutable version of historical pregame features
      description: Requires authenticated administrator access. The optional featureVersion pregame-v4-personnel-context creates additive rows from pregame-v3 and never overwrites v3. Never trains or scores a betting model.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PregameFeatureBuildInput"
      responses:
        "200":
          description: Feature build result
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /features/personnel-context/game/{gameId}:
    get:
      operationId: getPersonnelContextForGame
      tags: [dashboard]
      summary: Read auditable point-in-time personnel and context intelligence
      description: Returns probable starters, QB certainty, injury impacts, OL continuity, unit matchups, explicit weather/schedule limitations, immutable market movement, and non-betting data confidence.
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Personnel and context audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonnelContext"
        "404":
          description: Game not found
  /features/personnel-context/audit:
    get:
      operationId: listPersonnelContextAudit
      tags: [dashboard]
      summary: List persisted Phase 7 personnel-context audit rows
      parameters:
        - name: gameId
          in: query
          schema: { type: string }
        - name: teamId
          in: query
          schema: { type: string }
        - name: season
          in: query
          schema: { type: integer }
        - name: week
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: Personnel-context audit rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonnelContextAuditRow"
  /features/personnel-context/coverage:
    get:
      operationId: getPersonnelContextCoverage
      tags: [dashboard]
      summary: Read current-week personnel and weather coverage
      responses:
        "200":
          description: Current-week coverage and source policy assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonnelContextCoverage"
  /features/personnel-context/challenger-readiness:
    get:
      operationId: getChallengerReadinessReport
      tags: [dashboard]
      summary: Read evaluation-only challenger readiness coverage
      description: >
        Returns cutoff-safe personnel coverage for the selected season/week,
        chronological weekly aggregates, bounded persisted feed-health evidence,
        and explicit evaluation-only readiness thresholds. This endpoint never
        trains, promotes, or starts a model and is not betting confidence.
      responses:
        "200":
          description: Challenger readiness report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengerReadinessReport"
  /teams:
    get:
      operationId: listTeams
      tags: [nfl]
      summary: List NFL teams
      responses:
        "200":
          description: NFL teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get safe application settings
      responses:
        "200":
          description: Application settings without secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update model and sportsbook settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated application settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
  /consumer/dashboard:
    get:
      operationId: getConsumerDashboard
      tags: [nfl]
      summary: Read the persisted consumer game dashboard
      description: Returns consumer-safe, persisted data only. It never starts data synchronization or model computation.
      responses:
        "200":
          description: Consumer dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerDashboard"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/games:
    get:
      operationId: listConsumerGames
      tags: [nfl]
      summary: Read consumer-safe persisted games
      description: Returns at most 100 games in kickoff order from persisted data. It never starts synchronization, context builds, prediction generation, or grading.
      parameters:
        - name: season
          in: query
          schema: { type: integer, minimum: 2020 }
        - name: week
          in: query
          schema: { type: integer, minimum: 1, maximum: 22 }
      responses:
        "200":
          description: Consumer games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerGames"
        "400":
          $ref: "#/components/responses/ConsumerInvalidRequest"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/games/{gameId}:
    get:
      operationId: getConsumerGame
      tags: [nfl]
      summary: Read a consumer-safe persisted game detail
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Consumer game detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerGameDetail"
        "404":
          $ref: "#/components/responses/ConsumerGameNotFound"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/performance:
    get:
      operationId: getConsumerPerformance
      tags: [nfl]
      summary: Read consumer-safe persisted performance
      responses:
        "200":
          description: Consumer performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerPerformance"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/trends:
    get:
      operationId: getConsumerTrends
      tags: [nfl]
      summary: Read consumer-safe performance trends
      responses:
        "200":
          description: Consumer trends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerTrends"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/props:
    get:
      operationId: getConsumerPropsAvailability
      tags: [nfl]
      summary: Read player props availability
      description: Player props are intentionally not available in V1.
      responses:
        "200":
          description: Props placeholder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerPropsAvailability"
components:
  responses:
    ConsumerDataUnavailable:
      description: Consumer data is temporarily unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConsumerError" }
    ConsumerInvalidRequest:
      description: Invalid consumer request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConsumerError" }
    ConsumerGameNotFound:
      description: Consumer game unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConsumerError" }
  schemas:
    ConsumerError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, enum: [consumer_data_unavailable, invalid_request, game_not_found] }
    ConsumerTeam:
      type: object
      required: [name, abbreviation, logoUrl]
      properties:
        name: { type: string }
        abbreviation: { type: string }
        logoUrl: { type: ["string", "null"] }
    ConsumerMarketQuote:
      type: object
      required: [sportsbook, selection, point, price, capturedAt]
      properties:
        sportsbook: { type: string }
        selection: { type: string }
        point: { type: ["number", "null"] }
        price: { type: number }
        capturedAt: { type: ["string", "null"], format: date-time }
    ConsumerMarketEvidence:
      type: object
      required: [available, capturedAt, message]
      properties:
        available: { type: boolean }
        capturedAt: { type: ["string", "null"], format: date-time }
        message: { type: ["string", "null"] }
    ConsumerGameMarket:
      type: object
      required: [spread, moneyline, total, evidence]
      properties:
        spread: { anyOf: [{ $ref: "#/components/schemas/ConsumerMarketQuote" }, { type: "null" }] }
        moneyline: { anyOf: [{ $ref: "#/components/schemas/ConsumerMarketQuote" }, { type: "null" }] }
        total: { anyOf: [{ $ref: "#/components/schemas/ConsumerMarketQuote" }, { type: "null" }] }
        evidence: { $ref: "#/components/schemas/ConsumerMarketEvidence" }
    ConsumerMarketComparison:
      type: object
      required: [market, label, state, modelValue, marketValue, difference, differenceUnit, selectedQuote, firstObserved, current, modelTimestamp, marketTimestamp]
      properties:
        market: { type: string, enum: [spread, total, moneyline] }
        label: { type: string }
        state: { type: string, enum: [available, stale, absent] }
        modelValue: { type: ["number", "null"] }
        marketValue: { type: ["number", "null"] }
        difference: { type: ["number", "null"] }
        differenceUnit: { type: string, enum: [points, probability_points] }
        selectedQuote: { anyOf: [{ $ref: "#/components/schemas/ConsumerMarketQuote" }, { type: "null" }] }
        firstObserved: { anyOf: [{ $ref: "#/components/schemas/ConsumerMarketQuote" }, { type: "null" }] }
        current: { anyOf: [{ $ref: "#/components/schemas/ConsumerMarketQuote" }, { type: "null" }] }
        modelTimestamp: { type: ["string", "null"], format: date-time }
        marketTimestamp: { type: ["string", "null"], format: date-time }
    ConsumerMarketBoard:
      type: object
      required: [status, staleAfterMinutes, selectionRule, comparisons]
      properties:
        status: { type: string, enum: [available, partial, stale, absent] }
        staleAfterMinutes: { type: integer }
        selectionRule: { type: string }
        comparisons:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/ConsumerMarketComparison" }
    ConsumerGame:
      type: object
      required: [gameId, season, week, kickoffTime, gameStatus, venue, matchup, finalScore, prediction, market, marketBoard, dataConfidence, availability]
      properties:
        gameId: { type: string }
        season: { type: integer }
        week: { type: integer }
        kickoffTime: { type: ["string", "null"], format: date-time }
        gameStatus: { type: string }
        venue: { type: ["string", "null"] }
        matchup:
          type: object
          required: [home, away]
          properties:
            home: { $ref: "#/components/schemas/ConsumerTeam" }
            away: { $ref: "#/components/schemas/ConsumerTeam" }
        finalScore:
          type: ["object", "null"]
          required: [home, away]
          properties:
            home: { type: integer }
            away: { type: integer }
        prediction:
          type: ["object", "null"]
          required: [modelLabel, projectedHomeScore, projectedAwayScore, projectedMargin, projectedTotal, homeWinProbability, awayWinProbability]
          properties:
            modelLabel: { type: string, const: Gridline Production Model }
            projectedHomeScore: { type: ["number", "null"] }
            projectedAwayScore: { type: ["number", "null"] }
            projectedMargin: { type: ["number", "null"] }
            projectedTotal: { type: ["number", "null"] }
            homeWinProbability: { type: ["number", "null"] }
            awayWinProbability: { type: ["number", "null"] }
        market: { $ref: "#/components/schemas/ConsumerGameMarket" }
        marketBoard: { $ref: "#/components/schemas/ConsumerMarketBoard" }
        dataConfidence:
          type: object
          required: [label, score, reason]
          properties:
            label: { type: string, enum: [Updating, Limited, Moderate, Standard] }
            score: { type: ["number", "null"] }
            reason: { type: ["string", "null"] }
        availability:
          type: object
          required: [prediction, market]
          properties:
            prediction: { type: ["string", "null"] }
            market: { type: ["string", "null"] }
    ConsumerGames:
      type: object
      required: [status, coverage, games]
      properties:
        status: { type: string, enum: [available, partial, stale, absent] }
        coverage:
          type: object
          required: [games, gamesWithComparison, DraftKings, FanDuel]
          properties:
            games: { type: integer }
            gamesWithComparison: { type: integer }
            DraftKings: { type: integer }
            FanDuel: { type: integer }
        games:
          type: array
          items: { $ref: "#/components/schemas/ConsumerGame" }
    ConsumerDashboard:
      type: object
      required: [status, games, note]
      properties:
        status: { type: string, enum: [available, unavailable] }
        games:
          type: array
          items: { $ref: "#/components/schemas/ConsumerGame" }
        note: { type: string }
    ConsumerGameDetail:
      allOf:
        - $ref: "#/components/schemas/ConsumerGame"
        - type: object
          required: [weather, movement, context, analysis]
          properties:
            weather: { $ref: "#/components/schemas/ConsumerWeather" }
            movement: { $ref: "#/components/schemas/ConsumerMovement" }
            context: { $ref: "#/components/schemas/ConsumerContext" }
            analysis:
              type: object
              required: [drivers, availability]
              properties:
                drivers: { type: array, items: { type: string } }
                availability:
                  type: object
                  required: [weather, personnel, movement]
                  properties:
                    weather: { type: ["string", "null"] }
                    personnel: { type: ["string", "null"] }
                    movement: { type: ["string", "null"] }
    ConsumerWeather:
      type: object
      required: [available, summary, temperature, sustainedWind, windGust, precipitationProbability, precipitationType, humidity, indoorOutdoor, roofStatus, validTime, message]
      properties:
        available: { type: boolean }
        summary: { type: ["string", "null"] }
        temperature: { type: ["number", "null"] }
        sustainedWind: { type: ["number", "null"] }
        windGust: { type: ["number", "null"] }
        precipitationProbability: { type: ["number", "null"] }
        precipitationType: { type: ["string", "null"] }
        humidity: { type: ["number", "null"] }
        indoorOutdoor: { type: ["string", "null"] }
        roofStatus: { type: ["string", "null"] }
        validTime: { type: ["string", "null"], format: date-time }
        message: { type: ["string", "null"] }
    ConsumerMovementQuote:
      type: object
      required: [point, price, capturedAt]
      properties:
        point: { type: ["number", "null"] }
        price: { type: number }
        capturedAt: { type: string, format: date-time }
    ConsumerMovementItem:
      type: object
      required: [sportsbook, market, selection, firstObserved, current, finalPreKickoff, observations]
      properties:
        sportsbook: { type: string, enum: [DraftKings, FanDuel] }
        market: { type: string, enum: [spread, total, moneyline] }
        selection: { type: string }
        firstObserved: { $ref: "#/components/schemas/ConsumerMovementQuote" }
        current: { $ref: "#/components/schemas/ConsumerMovementQuote" }
        finalPreKickoff:
          oneOf:
            - $ref: "#/components/schemas/ConsumerMovementQuote"
            - type: "null"
        observations:
          type: array
          items: { $ref: "#/components/schemas/ConsumerMovementQuote" }
    ConsumerMovement:
      type: object
      required: [available, streams, completeness, message]
      properties:
        available: { type: boolean }
        streams:
          type: array
          maxItems: 24
          items: { $ref: "#/components/schemas/ConsumerMovementItem" }
        completeness:
          type: object
          required: [status, maximumObservations, totalObservations, returnedObservations, omittedObservations]
          properties:
            status: { type: string, enum: [complete, truncated] }
            maximumObservations: { type: integer, const: 200 }
            totalObservations: { type: integer }
            returnedObservations: { type: integer }
            omittedObservations: { type: integer }
        message: { type: ["string", "null"] }
    ConsumerContextTeam:
      type: object
      required: [side, name, abbreviation, qbCertainty, qbChange, personnelCompleteness, offenseInjuryImpact, defenseInjuryImpact, depth]
      properties:
        side: { type: string, enum: [home, away] }
        name: { type: string }
        abbreviation: { type: string }
        qbCertainty: { type: ["number", "null"] }
        qbChange: { type: ["boolean", "null"] }
        personnelCompleteness: { type: ["number", "null"] }
        offenseInjuryImpact: { type: ["number", "null"] }
        defenseInjuryImpact: { type: ["number", "null"] }
        depth:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/ConsumerDepthPlayer" }
    ConsumerDepthPlayer:
      type: object
      required: [name, position, unit, depthRank, role, sourceLabel, recentSnapShare, injuryStatus, practiceStatus, starterConfidence, evidenceSummary]
      properties:
        name: { type: string }
        position: { type: string }
        unit: { type: string, enum: [offense, defense] }
        depthRank: { type: ["integer", "null"] }
        role: { type: string, enum: [published_starter, published_backup, projected_starter, uncertain] }
        sourceLabel: { type: string, enum: [Published depth, Projected from recent participation, Evidence uncertain] }
        recentSnapShare: { type: ["number", "null"] }
        injuryStatus: { type: ["string", "null"] }
        practiceStatus: { type: ["string", "null"] }
        starterConfidence: { type: ["number", "null"] }
        evidenceSummary: { type: ["string", "null"] }
    ConsumerProjectedMatchup:
      type: object
      required: [receiverName, defenderName, summary]
      properties:
        receiverName: { type: string }
        defenderName: { type: string }
        summary: { type: string }
    ConsumerContext:
      type: object
