openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NFL Analytics Model API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: nfl
    description: Live NFL schedule and team data
  - name: dashboard
    description: Dashboard summaries and data freshness
  - name: settings
    description: User-operable model and sportsbook settings
paths:
  /admin/verified-imagery/report:
    get:
      operationId: getVerifiedImageryReport
      tags: [dashboard]
      summary: Inspect unmatched and ambiguous nflverse imagery evidence
      security: [{ clerk: [] }]
      responses:
        "200":
          description: Source provenance, counts, and unresolved IDs for operator review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifiedImageryReport" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "503": { description: Source evidence unavailable }
  /admin/verified-imagery/candidates/{playerId}/image:
    get:
      operationId: getImageryCandidatePreview
      tags: [dashboard]
      summary: Inspect the current candidate bytes and SHA-256 before deciding
      security: [{ clerk: [] }]
      parameters:
        - { in: path, name: playerId, required: true, schema: { type: string } }
        - { in: query, name: sourceHash, required: true, schema: { type: string } }
      responses:
        "200":
          description: Image bytes with X-Image-SHA256 header
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        "409": { description: Candidate changed }
        "502": { description: Image unavailable }
  /admin/verified-imagery/candidates/{playerId}/history:
    get:
      operationId: getPlayerImageryReviewHistory
      tags: [dashboard]
      summary: Inspect append-only review decisions across source versions
      security: [{ clerk: [] }]
      parameters:
        - { in: path, name: playerId, required: true, schema: { type: string } }
      responses:
        "200":
          description: All prior decisions for this source player
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  required: [id, playerId, provider, sourceHash, imageUrl, imageHash, rightsEvidence, decision, reason, reviewerId, reviewedAt]
                  properties:
                    id: { type: integer }
                    playerId: { type: string }
                    provider: { type: string }
                    sourceHash: { type: string }
                    imageUrl: { type: string }
                    imageHash: { type: string }
                    rightsEvidence: { type: string }
                    decision: { type: string }
                    reason: { type: string }
                    reviewerId: { type: string }
                    reviewedAt: { type: string, format: date-time }
  /admin/verified-imagery/candidates/{playerId}/review:
    post:
      operationId: reviewImageryCandidate
      tags: [dashboard]
      summary: Record an append-only human image identity decision
      security: [{ clerk: [] }]
      parameters:
        - { in: path, name: playerId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceHash, imageHash, decision, reason]
              properties:
                sourceHash: { type: string }
                imageHash: { type: string }
                decision: { type: string, enum: [approved, rejected] }
                reason: { type: string }
      responses:
        "201":
          description: Review recorded
          content:
            application/json:
              schema:
                type: object
                required: [reviewId, decision]
                properties:
                  reviewId: { type: integer }
                  decision: { type: string }
        "400": { description: Invalid review }
        "409": { description: Candidate changed or rights unavailable }
        "503": { description: Review unavailable }
  /verified-imagery/player/{playerId}:
    get:
      operationId: getReviewedPlayerImage
      tags: [nfl]
      summary: Serve only the currently approved image bytes
      parameters:
        - { in: path, name: playerId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Reviewed image
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        "404": { description: No current approved image }
  /admin/confidence/audit:
    get:
      operationId: getConfidenceAudit
      tags: [dashboard]
      summary: Inspect confidence methodology and calculated evidence
      security: [{ clerk: [] }]
      responses:
        "200":
          description: Confidence audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfidenceAudit" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/confidence/calculate:
    post:
      operationId: appendConfidenceEvidence
      tags: [dashboard]
      summary: Calculate and append confidence evidence for a season and week
      security: [{ clerk: [] }]
      parameters:
        - name: season
          in: query
          required: false
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: week
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 25 }
      responses:
        "200":
          description: Confidence calculation summary
          content:
            application/json:
              schema:
                type: object
                required: [gamesEvaluated, marketResultsCalculated, marketResultsPersisted, version]
                properties:
                  gamesEvaluated: { type: integer }
                  marketResultsCalculated: { type: integer }
                  marketResultsPersisted: { type: integer }
                  version: { type: string }
        "400": { description: Invalid season or week }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get the dashboard overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /analytics/usage-event:
    post:
      operationId: captureUsageAnalyticsEvent
      tags: [dashboard]
      summary: Capture a privacy-safe Player Usage Lab interaction
      security: [{ clerk: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageAnalyticsEventInput"
      responses:
        "204": { description: Event captured }
        "400": { description: Invalid event }
        "401": { description: Authentication required }
  /admin/usage-analytics:
    get:
      operationId: getUsageAnalyticsSummary
      tags: [dashboard]
      summary: Summarize Player Usage Lab interactions for administrators
      security: [{ clerk: [] }]
      parameters:
        - name: period
          in: query
          required: false
          description: Bounded reporting period ending today (UTC)
          schema:
            type: string
            enum: [7d, 14d, 30d]
            default: 7d
      responses:
        "200":
          description: Usage Lab interaction summary with daily trends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageAnalyticsSummary"
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /data-health:
    get:
      operationId: getDataHealth
      tags: [dashboard]
      summary: Get freshness and availability for each data provider
      responses:
        "200":
          description: Data health status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataHealth"
  /admin/sleeper-identity-report:
    get:
      operationId: getSleeperIdentityReport
      tags: [dashboard]
      summary: Read the administrator-only Sleeper identity mapping report
      description: Returns immutable mapping coverage, classification totals, position coverage, all-team depth candidates, a deterministic validation sample, risks, suitability, and safety assertions. Provider diagnostics are never exposed through consumer APIs.
      responses:
        "200":
          description: Sleeper identity mapping and validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleeperIdentityReport"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /games:
    get:
      operationId: listGames
      tags: [nfl]
      summary: List NFL games for a season and week
      parameters:
        - name: season
          in: query
          required: false
          schema:
            type: integer
            minimum: 2020
        - name: week
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 22
      responses:
        "200":
          description: NFL games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
  /games/{gameId}:
    get:
      operationId: getGame
      tags: [nfl]
      summary: Get one game with current odds and model status
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Game not found
  /games/{gameId}/odds-history:
    get:
      operationId: getOddsHistory
      tags: [nfl]
      summary: Get immutable sportsbook line history for one game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Historical sportsbook observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsHistory"
        "404":
          description: Game not found
  /odds/capture:
    post:
      operationId: captureOdds
      tags: [dashboard]
      summary: Make one explicit Odds API capture
      description: Performs one server-side request only. It never polls or retries and never exposes the API key.
      responses:
        "200":
          description: Capture completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsCaptureResult"
        "502":
          description: Capture failed
  /odds/audit:
    get:
      operationId: listOddsAudits
      tags: [dashboard]
      summary: Read persisted per-event Odds API matching audits
      description: Returns parsed provider fields and matching diagnostics without raw payloads or keyed URLs.
      parameters:
        - name: requestId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [matched_saved, matched_post_kickoff_skipped, unmatched]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: Persisted per-event audits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OddsEventAudit"
  /admin/player-recovery/receipts:
    get:
      operationId: listPlayerRecoveryReceipts
      tags: [dashboard]
      summary: Review attested one-shot player recovery receipts
      description: Administrator-only, latest first. Receipts are retained for 90 days and link to data_sync_runs by syncRunJobKey. No provider errors or database identity claims are exposed.
      security: [{ clerk: [] }]
      parameters:
        - name: receiptId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Retained receipts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerRecoveryReceiptsResult" }
        "400": { description: Invalid lookup }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "500": { description: Receipt store unavailable }
  /admin/player-recovery/cleanup-health:
    get:
      operationId: getPlayerRecoveryReceiptCleanupHealth
      tags: [dashboard]
      summary: Review worker-owned player receipt cleanup health and repeated-failure alert
      security: [{ clerk: [] }]
      responses:
        "200":
          description: Privacy-safe cleanup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerRecoveryReceiptCleanupHealth" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "500": { description: Cleanup health unavailable }
  /data-sync/schedule:
    post:
      operationId: syncSchedule
      tags: [nfl]
      summary: Persist the current and next two exposed NFL weeks
      description: Performs an explicit ESPN schedule sync and only upserts games; it never deletes schedule history or calls the Odds API.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleSyncRequest"
      responses:
        "200":
          description: Schedule synchronization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSyncResult"
        "502":
          description: Schedule synchronization failed
  /features/pregame/health:
    get:
      operationId: getPregameFeatureHealth
      tags: [dashboard]
      summary: Read historical pregame feature coverage and limitations
      parameters:
        - name: featureVersion
          in: query
          required: false
          schema: { type: string, enum: [pregame-v3, pregame-v4-personnel-context] }
      responses:
        "200":
          description: Feature definition and generated row counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PregameFeatureHealth"
  /features/pregame/game/{gameId}:
    get:
      operationId: getPregameFeaturesForGame
      tags: [nfl]
      summary: Read versioned pregame features for one game
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Team-level pregame feature rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PregameFeatureRow"
  /features/audit:
    get:
      operationId: listPregameFeatureAudit
      tags: [dashboard]
      summary: Read feature values and point-in-time source audit metadata
      parameters:
        - name: season
          in: query
          required: false
          schema: { type: integer }
        - name: week
          in: query
          required: false
          schema: { type: integer }
        - name: gameId
          in: query
          required: false
          schema: { type: string }
        - name: teamId
          in: query
          required: false
          schema: { type: string }
        - name: featureVersion
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Filtered feature audit rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PregameFeatureAuditRow"
  /features/live-input-integrity:
    get:
      operationId: getLiveModelInputIntegrity
      summary: Audit exact upcoming-game inputs for active production models
      responses:
        "200":
          description: Upcoming live model input integrity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelInputIntegrityAudit"
  /features/pregame/build:
    post:
      operationId: buildPregameFeatures
      tags: [dashboard]
      summary: Build an immutable version of historical pregame features
      description: Requires authenticated administrator access. The optional featureVersion pregame-v4-personnel-context creates additive rows from pregame-v3 and never overwrites v3. Never trains or scores a betting model.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PregameFeatureBuildInput"
      responses:
        "200":
          description: Feature build result
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /features/personnel-context/game/{gameId}:
    get:
      operationId: getPersonnelContextForGame
      tags: [dashboard]
      summary: Read auditable point-in-time personnel and context intelligence
      description: Returns probable starters, QB certainty, injury impacts, OL continuity, unit matchups, explicit weather/schedule limitations, immutable market movement, and non-betting data confidence.
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Personnel and context audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonnelContext"
        "404":
          description: Game not found
  /features/personnel-context/audit:
    get:
      operationId: listPersonnelContextAudit
      tags: [dashboard]
      summary: List persisted Phase 7 personnel-context audit rows
      parameters:
        - name: gameId
          in: query
          schema: { type: string }
        - name: teamId
          in: query
          schema: { type: string }
        - name: season
          in: query
          schema: { type: integer }
        - name: week
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: Personnel-context audit rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonnelContextAuditRow"
  /features/personnel-context/coverage:
    get:
      operationId: getPersonnelContextCoverage
      tags: [dashboard]
      summary: Read current-week personnel and weather coverage
      responses:
        "200":
          description: Current-week coverage and source policy assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonnelContextCoverage"
  /features/personnel-context/challenger-readiness:
    get:
      operationId: getChallengerReadinessReport
      tags: [dashboard]
      summary: Read evaluation-only challenger readiness coverage
      description: >
        Returns cutoff-safe personnel coverage for the selected season/week,
        chronological weekly aggregates, bounded persisted feed-health evidence,
        and explicit evaluation-only readiness thresholds. This endpoint never
        trains, promotes, or starts a model and is not betting confidence.
      responses:
        "200":
          description: Challenger readiness report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengerReadinessReport"
  /teams:
    get:
      operationId: listTeams
      tags: [nfl]
      summary: List NFL teams
      responses:
        "200":
          description: NFL teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get safe application settings
      responses:
        "200":
          description: Application settings without secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update model and sportsbook settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated application settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
  /consumer/dashboard:
    get:
      operationId: getConsumerDashboard
      tags: [nfl]
      summary: Read the persisted consumer game dashboard
      description: Returns consumer-safe, persisted data only. It never starts data synchronization or model computation.
      responses:
        "200":
          description: Consumer dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerDashboard"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/weekly-picks:
    get:
      operationId: getConsumerWeeklyPicks
      tags: [nfl]
      summary: Read past persisted official weekly selections
      parameters:
        - name: season
          in: query
          schema: { type: integer, minimum: 2020 }
      responses:
        "200":
          description: Historical weekly picks and unavailable evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerWeeklyPickArchive"
        "400":
          description: Invalid season
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/schedule-selection:
    get:
      operationId: getConsumerScheduleSelection
      tags: [nfl]
      summary: Select a slate from persisted NFL schedule evidence
      responses:
        "200":
          description: Read-only schedule selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerScheduleSelection"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/games:
    get:
      operationId: listConsumerGames
      tags: [nfl]
      summary: Read consumer-safe persisted games
      description: Returns at most 100 games in kickoff order from persisted data. It never starts synchronization, context builds, prediction generation, or grading.
      parameters:
        - name: season
          in: query
          schema: { type: integer, minimum: 2020 }
        - name: week
          in: query
          schema: { type: integer, minimum: 1, maximum: 22 }
      responses:
        "200":
          description: Consumer games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerGames"
        "400":
          $ref: "#/components/responses/ConsumerInvalidRequest"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/games/{gameId}:
    get:
      operationId: getConsumerGame
      tags: [nfl]
      summary: Read a consumer-safe persisted game detail
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Consumer game detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerGameDetail"
        "404":
          $ref: "#/components/responses/ConsumerGameNotFound"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/games/{gameId}/alerts:
    parameters:
      - name: gameId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getConsumerGameAlerts
      tags: [nfl]
      summary: Check opted-in matchup changes against persisted evidence
      responses:
        "200":
          description: Alert preference and detected changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerGameAlerts" }
        "401":
          description: Sign-in required
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
    put:
      operationId: enableConsumerGameAlerts
      tags: [nfl]
      summary: Opt in to in-app alerts for an upcoming game
      responses:
        "200":
          description: Alerts enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerGameAlerts" }
        "400":
          $ref: "#/components/responses/ConsumerInvalidRequest"
        "401":
          description: Sign-in required
        "404":
          $ref: "#/components/responses/ConsumerGameNotFound"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
    delete:
      operationId: disableConsumerGameAlerts
      tags: [nfl]
      summary: Disable and clear this game's alerts
      responses:
        "204":
          description: Alerts disabled
        "401":
          description: Sign-in required
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/saved-games/ids:
    get:
      operationId: listSavedGameIds
      tags: [nfl]
      summary: List the signed-in user's saved game IDs
      responses:
        "200":
          description: Saved game IDs
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401":
          description: Sign in required
  /consumer/saved-games:
    get:
      operationId: listSavedGames
      tags: [nfl]
      summary: Read the signed-in user's saved games with current persisted evidence
      responses:
        "200":
          description: Saved games
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsumerGame" }
        "401":
          description: Sign in required
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/saved-games/{gameId}:
    parameters:
      - name: gameId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: saveConsumerGame
      tags: [nfl]
      summary: Save a game for the signed-in user
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/ConsumerInvalidRequest"
        "401":
          description: Sign in required
        "404":
          $ref: "#/components/responses/ConsumerGameNotFound"
        "409":
          description: Saved game limit reached
    delete:
      operationId: removeSavedConsumerGame
      tags: [nfl]
      summary: Remove a game from the signed-in user's saves
      responses:
        "204":
          description: Removed or already absent
        "400":
          $ref: "#/components/responses/ConsumerInvalidRequest"
        "401":
          description: Sign in required
  /consumer/performance:
    get:
      operationId: getConsumerPerformance
      tags: [nfl]
      summary: Read consumer-safe persisted performance
      responses:
        "200":
          description: Consumer performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerPerformance"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/trends:
    get:
      operationId: getConsumerTrends
      tags: [nfl]
      summary: Read consumer-safe performance trends
      responses:
        "200":
          description: Consumer trends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerTrends"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/team-analytics:
    get:
      operationId: getConsumerTeamAnalytics
      tags: [nfl]
      summary: Read final-game NFLverse team EPA and success-rate observations
      parameters:
        - in: query
          name: season
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - in: query
          name: throughWeek
          required: true
          schema: { type: integer, minimum: 1, maximum: 18 }
        - in: query
          name: window
          required: true
          schema: { type: string, enum: [season, last3, last5, last8], default: season }
        - in: query
          name: teams
          description: Optional comma-separated canonical abbreviations, at most four, for trend selection.
          schema: { type: string }
      responses:
        "200":
          description: Coverage-aware game-mean EPA and per-game team observations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerTeamAnalytics" }
        "400":
          description: Invalid season, week, window, or team selection
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/graded-charts:
    get:
      operationId: getConsumerGradedCharts
      tags: [nfl]
      summary: Read complete official pregame final-game grading aggregates
      parameters:
        - in: query
          name: season
          schema: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        "200":
          description: Season totals and chronological cumulative grades, not betting returns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerGradedCharts" }
        "400":
          description: Invalid season
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/props:
    get:
      operationId: getConsumerPropsAvailability
      tags: [nfl]
      summary: Read player props availability
      description: Player props are intentionally not available in V1.
      responses:
        "200":
          description: Props placeholder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerPropsAvailability"
  /consumer/player-projections:
    get:
      operationId: getConsumerPlayerProjections
      tags: [nfl]
      summary: Read development-only historical player projection simulations
      description: Historical pregame simulations are not live predictions or betting props.
      responses:
        "200":
          description: Historical simulation or explicit unavailability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPlayerProjections" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/player-projections/upcoming:
    get:
      operationId: getConsumerUpcomingPlayerProjections
      tags: [nfl]
      summary: Read development-only upcoming conditional player projections
      description: >
        Read-only forecasts from the existing frozen player models for players
        eligible for conditional projections. An estimate is conditional on
        participation, is not a guarantee of availability, and is not a betting
        recommendation or production forecast.
      responses:
        "200":
          description: Development forecasts or explicit unavailability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerUpcomingPlayerProjections" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/player-td-forecasts:
    get:
      operationId: getConsumerPlayerTdForecasts
      tags: [nfl]
      summary: Read upcoming player touchdown probability rankings
      description: >
        Development-only touchdown probability estimates ranked within each
        matchup. These are model estimates, not betting advice or odds. Defensive
        context is team-level; individual wide receiver-cornerback assignments
        are not inferred.
      responses:
        "200":
          description: Touchdown forecasts or explicit unavailability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPlayerTdForecasts" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/player-projections/upcoming-readiness:
    get:
      operationId: getConsumerUpcomingPlayerProjectionReadiness
      tags: [nfl]
      summary: Read the development-only upcoming player forecast readiness audit
      description: >
        Read-only audit of the nearest upcoming regular-season week. It never
        generates forecasts. Provider observation timestamps are distinguished
        from ingestion timestamps where the source schema permits.
      responses:
        "200":
          description: Upcoming player forecast readiness, or explicit unavailability outside development
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpcomingPlayerProjectionReadiness" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/defense-vs-position:
    get:
      operationId: getConsumerDefenseVsPosition
      tags: [nfl]
      summary: Read observed regular-season defensive allowances by opposing position
      description: >
        Read-only retrospective history. Final games strictly before a game's kickoff
        are eligible; metric-specific denominators require complete weekly stats and
        PBP evidence for both teams. Last-two-weeks selects the latest two
        schedule-complete weeks before cutoff; last-three and last-five select
        covered games. Missing games within the selected span remain visible.
        Not a forecast or a historical point-in-time source snapshot.
      parameters:
        - name: season
          in: query
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: game
          in: query
          schema: { type: string }
        - name: window
          in: query
          schema: { type: string, enum: [last2Weeks, season, last3, last5], default: last2Weeks }
      responses:
        "200":
          description: Metric-specific game coverage and observed allowance for each defense
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerDefenseVsPosition" }
        "400": { $ref: "#/components/responses/ConsumerInvalidRequest" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/player-position-matchup:
    get:
      operationId: getConsumerPlayerPositionMatchup
      tags: [nfl]
      summary: Compare a player's observed prior appearances with opponent position allowances
      description: >
        Upcoming game only. The score is a descriptive index, never a verified
        predictive score. Projection fields remain unavailable unless separately
        qualified; missing rows are not zero. TD probability has a separate gate.
      parameters:
        - name: game
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: position
          in: query
          required: true
          schema: { type: string, enum: [QB, RB, WR, TE] }
        - name: window
          in: query
          schema: { type: string, enum: [season, last3, last5], default: last5 }
        - name: player
          in: query
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Bounded player choices and selected comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPlayerPositionMatchup" }
        "400": { $ref: "#/components/responses/ConsumerInvalidRequest" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/player-usage:
    get:
      operationId: getConsumerPlayerUsage
      tags: [nfl]
      summary: Read cutoff-safe player usage history
      parameters:
        - name: team
          in: query
          schema: { type: string }
        - name: position
          in: query
          schema: { type: string, enum: [QB, RB, WR, TE] }
        - name: game
          in: query
          schema: { type: string }
        - name: window
          in: query
          schema: { type: string, enum: [last3, last5, last8, season], default: last5 }
      responses:
        "200":
          description: Player usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPlayerUsage" }
        "400": { $ref: "#/components/responses/ConsumerInvalidRequest" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/player-usage-games:
    get:
      operationId: listConsumerPlayerUsageGames
      tags: [nfl]
      summary: List current-season games available as player-usage cutoffs
      description: Returns lightweight persisted schedule rows for the optional Usage Lab game-context selector.
      responses:
        "200":
          description: Player-usage game contexts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPlayerUsageGames" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/red-zone-opportunities:
    get:
      operationId: getConsumerRedZoneOpportunities
      tags: [nfl]
      summary: Read cutoff-safe, source-backed red-zone opportunities
      description: >
        Returns regular-season nflverse play-by-play counts at pre-play yardline
        thresholds 20, 10, and 5 (overlapping zones). Targets include credited
        intended receivers on incomplete passes. Carries follow rush_attempt,
        including credited QB scrambles. Two-point tries, kneels, spikes,
        no-play/nullified plays, and attempts without a credited player ID are
        excluded; missing-ID attempts are also excluded from team denominators.
        last3 uses each player's last three completed appearances identified by
        regular-season player statistics or positive offensive snaps with a
        verified GSIS/PFR crosswalk, across teams before results are partitioned
        into separate playerId/teamId rows. Season and last3 select the
        original completed-appearance window first, then aggregate only games
        with complete team play-by-play and verified player opportunity
        evidence. Missing appearances are excluded from the count and surfaced
        in sourceCoverage rather than treated as zero. Week lists and kickoff
        bounds specify the exact coverage period for each figure.
        sourceUpdatedAt is null when nflverse does not publish a source update
        timestamp. A game parameter sets a pre-kickoff cutoff and excludes that
        game; it does not require prediction or market data.
      parameters:
        - name: season
          in: query
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: team
          in: query
          schema: { type: string }
        - name: position
          in: query
          schema: { type: string, enum: [QB, RB, WR, TE] }
        - name: zone
          in: query
          description: Pre-play yardline_100 threshold; zones overlap.
          schema: { type: integer, enum: [20, 10, 5] }
        - name: period
          in: query
          schema: { type: string, enum: [season, last3], default: season }
        - name: game
          in: query
          description: Gridline game ID used as the excluded-game pre-kickoff cutoff.
          schema: { type: string }
      responses:
        "200":
          description: Player red-zone counts, team shares, and PBP coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerRedZoneOpportunities" }
        "400": { $ref: "#/components/responses/ConsumerInvalidRequest" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
components:
  responses:
    ConsumerDataUnavailable:
      description: Consumer data is temporarily unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConsumerError" }
    ConsumerInvalidRequest:
      description: Invalid consumer request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConsumerError" }
    ConsumerGameNotFound:
      description: Consumer game unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConsumerError" }
  schemas:
    VerifiedImageryIssue:
      type: object
      required: [id, reason]
      properties:
        id: { type: string }
        reason: { type: string }
    VerifiedImagerySource:
      type: object
      required: [url, sha256, fetchedAt, rows, version]
      properties:
        url: { type: string }
        sha256: { type: string }
        fetchedAt: { type: string, format: date-time }
        rows: { type: integer }
        version: { type: string }
    VerifiedImageryReport:
      type: object
      required: [status, reason, sources, sourceNotice, counts, categories]
      properties:
        status: { type: string, enum: [ready, partial, stale] }
        reason: { type: ["string", "null"] }
        sourceNotice: { type: string }
        sources:
          type: object
          required: [teams, roster, players]
          properties:
            teams:
              anyOf:
                - { $ref: "#/components/schemas/VerifiedImagerySource" }
                - { type: "null" }
            roster:
              anyOf:
                - { $ref: "#/components/schemas/VerifiedImagerySource" }
                - { type: "null" }
            players:
              anyOf:
                - { $ref: "#/components/schemas/VerifiedImagerySource" }
                - { type: "null" }
        counts:
          type: object
          additionalProperties: { type: integer }
        categories:
          type: object
          required: [unmatchedTeams, ambiguousTeams, unresolvedRosterIds, ambiguousIdentities, duplicateRosterIds, missingHeadshotUrls, unresolvedConsumerIds]
          properties:
            unmatchedTeams: { type: array, items: { $ref: "#/components/schemas/VerifiedImageryIssue" } }
            ambiguousTeams: { type: array, items: { $ref: "#/components/schemas/VerifiedImageryIssue" } }
            unresolvedRosterIds: { type: array, items: { $ref: "#/components/schemas/VerifiedImageryIssue" } }
            ambiguousIdentities: { type: array, items: { $ref: "#/components/schemas/VerifiedImageryIssue" } }
            duplicateRosterIds: { type: array, items: { $ref: "#/components/schemas/VerifiedImageryIssue" } }
            missingHeadshotUrls: { type: array, items: { $ref: "#/components/schemas/VerifiedImageryIssue" } }
            unresolvedConsumerIds: { type: array, items: { $ref: "#/components/schemas/VerifiedImageryIssue" } }
        candidates:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              playerId: { type: string }
              playerName: { type: ["string", "null"] }
              sourceEspnId: { type: ["string", "null"] }
              imageUrl: { type: string }
              provider: { type: string }
              sourceHash: { type: ["string", "null"] }
    PlayerRecoveryReceiptCleanupHealth:
      type: object
      additionalProperties: false
      required: [retentionDays, cleanupIntervalHours, status, cleanupState, lastAttemptAt, lastAttemptStatus, nextCleanupAt, consecutiveFailures, firstFailureAt, lastSuccessfulAt, lastSuccessfulDeletedReceipts, alert, workerOwned]
      properties:
        retentionDays: { type: integer }
        cleanupIntervalHours: { type: integer }
        status: { type: string, enum: [healthy, failed, pending] }
        cleanupState: { type: string, enum: [pending, on_time, overdue] }
        lastAttemptAt: { type: ["string", "null"], format: date-time }
        lastAttemptStatus: { type: ["string", "null"], enum: [success, failed, null] }
        nextCleanupAt: { type: ["string", "null"], format: date-time }
        consecutiveFailures: { type: integer }
        firstFailureAt: { type: ["string", "null"], format: date-time }
        lastSuccessfulAt: { type: ["string", "null"], format: date-time }
        lastSuccessfulDeletedReceipts: { type: ["integer", "null"] }
        alert:
          anyOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [code, severity, scope, title, detail]
              properties:
                code: { type: string, enum: [repeated_failures] }
                severity: { type: string, enum: [critical] }
                scope: { type: string, enum: [player-recovery-receipt-cleanup] }
                title: { type: string }
                detail: { type: string }
        workerOwned: { type: boolean }
    PlayerRecoveryReceiptsResult:
      type: object
      additionalProperties: false
      required: [retentionDays, receipts]
      properties:
        retentionDays: { type: integer }
        receipts:
          type: array
          items: { $ref: "#/components/schemas/PlayerRecoveryReceipt" }
    PlayerRecoveryReceipt:
      type: object
      additionalProperties: false
      required: [event, receiptId, approvedFeeds, target, syncRunJobKey, startedAt, completedAt, status, attempts]
      properties:
        event: { type: string, enum: [player_recovery_receipt] }
        receiptId: { type: string, format: uuid }
        approvedFeeds:
          type: array
          items: { type: string, enum: [injuries, sleeper] }
        target: { type: string, enum: [attested_development_primary, attested_disposable_development_primary] }
        syncRunJobKey: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        status: { type: string, enum: [success, partial_success, failed] }
        attempts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [feed, status]
            properties:
              feed: { type: string, enum: [injuries, sleeper] }
              status: { type: string, enum: [success, failed] }
              inserted: { type: integer, minimum: 0 }
              reason: { type: string, enum: [locked, sync_error] }
    UsageAnalyticsEventInput:
      type: object
      additionalProperties: false
      required: [eventName]
      properties:
        eventName:
          type: string
          enum: [usage_filter_changed, usage_sort_changed, usage_row_toggled, usage_filters_reset]
        filter: { type: string, enum: [team, position, window, game] }
        value: { type: string, maxLength: 32 }
        column:
          type: string
          enum: [name, primaryVolume, primaryYards, snapShare, targets, receptions, receivingYards, carries, rushingYards, totalTd, trend]
        direction: { type: string, enum: [asc, desc] }
        action: { type: string, enum: [expand, collapse] }
        position: { type: string, enum: [QB, RB, WR, TE, unknown] }
        trend: { type: string, enum: [up, down, flat, unavailable] }
        coverage: { type: string, enum: [complete, partial] }
        window: { type: string, enum: [last3, last5, last8, season] }
        hadTeam: { type: boolean }
        hadPosition: { type: boolean }
        hadGame: { type: boolean }
    UsageAnalyticsCount:
      type: object
      additionalProperties: false
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }
    UsageAnalyticsChoiceCount:
      type: object
      additionalProperties: false
      required: [label, choice, count]
      properties:
        label: { type: string }
        choice: { type: string }
        count: { type: integer }
    UsageAnalyticsDailyTrend:
      type: object
      additionalProperties: false
      required: [date, eventCount, rowExpansionCount]
      properties:
        date: { type: string, format: date }
        eventCount: { type: integer }
        rowExpansionCount: { type: integer }
    UsageAnalyticsSummary:
      type: object
      additionalProperties: false
      required: [periodStart, periodEnd, periodDays, collectionStatus, daysWithActivity, dailyTrends, totalEvents, filterChanges, sortChoices, expansionsByPosition, expansionsByTrend, expansionsByCoverage, expansionsByWindow, resets]
      properties:
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        periodDays: { type: integer }
        collectionStatus:
          type: string
          enum: [empty, partial, complete]
        daysWithActivity: { type: integer }
        dailyTrends:
          type: array
          items: { $ref: "#/components/schemas/UsageAnalyticsDailyTrend" }
        totalEvents: { type: integer }
        filterChanges:
          type: array
          items: { $ref: "#/components/schemas/UsageAnalyticsChoiceCount" }
        sortChoices:
          type: array
          items: { $ref: "#/components/schemas/UsageAnalyticsChoiceCount" }
        expansionsByPosition:
          type: array
          items: { $ref: "#/components/schemas/UsageAnalyticsCount" }
        expansionsByTrend:
          type: array
          items: { $ref: "#/components/schemas/UsageAnalyticsCount" }
        expansionsByCoverage:
          type: array
          items: { $ref: "#/components/schemas/UsageAnalyticsCount" }
        expansionsByWindow:
          type: array
          items: { $ref: "#/components/schemas/UsageAnalyticsCount" }
        resets: { type: integer }
    ConsumerError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, enum: [consumer_data_unavailable, invalid_request, game_not_found] }
    ConsumerGameAlert:
      type: object
      required: [category, detail, detectedAt]
      properties:
        category: { type: string, enum: [projection, personnel, market] }
        detail: { type: string }
        detectedAt: { type: string, format: date-time }
    ConsumerGameAlerts:
      type: object
      required: [enabled, events]
      properties:
        enabled: { type: boolean }
        events:
          type: array
          items: { $ref: "#/components/schemas/ConsumerGameAlert" }
    ConsumerTeam:
      type: object
      required: [name, abbreviation, logoUrl]
      properties:
        name: { type: string }
        abbreviation: { type: string }
        logoUrl: { type: ["string", "null"] }
    ConsumerMarketQuote:
      type: object
      required: [sportsbook, selection, point, price, capturedAt]
      properties:
        sportsbook: { type: string }
        selection: { type: string }
        point: { type: ["number", "null"] }
        price: { type: number }
        capturedAt: { type: ["string", "null"], format: date-time }
    ConsumerMarketEvidence:
      type: object
      required: [available, capturedAt, message]
      properties:
        available: { type: boolean }
        capturedAt: { type: ["string", "null"], format: date-time }
        message: { type: ["string", "null"] }
    ConsumerGameMarket:
      type: object
      required: [spread, moneyline, total, evidence]
      properties:
        spread: { anyOf: [{ $ref: "#/components/schemas/ConsumerMarketQuote" }, { type: "null" }] }
        moneyline: { anyOf: [{ $ref: "#/components/schemas/ConsumerMarketQuote" }, { type: "null" }] }
        total: { anyOf: [{ $ref: "#/components/schemas/ConsumerMarketQuote" }, { type: "null" }] }
        evidence: { $ref: "#/components/schemas/ConsumerMarketEvidence" }
    ConsumerMarketComparison:
      type: object
      required: [market, label, state, modelValue, marketValue, difference, differenceUnit, selectedQuote, currentQuotes, firstObserved, current, modelTimestamp, marketTimestamp, observationAgeMinutes, freshnessLabel]
      properties:
        market: { type: string, enum: [spread, total, moneyline] }
        label: { type: string }
        state: { type: string, enum: [available, stale, absent] }
        modelValue: { type: ["number", "null"] }
        marketValue: { type: ["number", "null"] }
        difference: { type: ["number", "null"] }
        differenceUnit: { type: string, enum: [points, probability_points] }
        selectedQuote: { anyOf: [{ $ref: "#/components/schemas/ConsumerMarketQuote" }, { type: "null" }] }
        firstObserved: { anyOf: [{ $ref: "#/components/schemas/ConsumerMarketQuote" }, { type: "null" }] }
        current: { anyOf: [{ $ref: "#/components/schemas/ConsumerMarketQuote" }, { type: "null" }] }
        currentQuotes: { type: array, items: { $ref: "#/components/schemas/ConsumerMarketQuote" } }
        modelTimestamp: { type: ["string", "null"], format: date-time }
        marketTimestamp: { type: ["string", "null"], format: date-time }
        observationAgeMinutes: { type: ["number", "null"] }
        freshnessLabel: { type: string }
    ConsumerMarketBoard:
      type: object
      required: [status, staleAfterMinutes, selectionRule, comparisons]
      properties:
        status: { type: string, enum: [available, partial, stale, absent] }
        staleAfterMinutes: { type: integer }
        selectionRule: { type: string }
        comparisons:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/ConsumerMarketComparison" }
    ConsumerSourceHealth:
      type: object
      required: [status, sources]
      properties:
        status: { type: string, enum: [healthy, partial, stale, unavailable] }
        sources:
          type: object
          required: [schedule, injuries, odds, players]
          properties:
            schedule: { $ref: "#/components/schemas/ConsumerSourceState" }
            injuries: { $ref: "#/components/schemas/ConsumerSourceState" }
            odds: { $ref: "#/components/schemas/ConsumerSourceState" }
            players: { $ref: "#/components/schemas/ConsumerSourceState" }
    ConsumerSourceState:
      type: object
      required: [status, lastAttemptAt, lastSuccessAt, sourceTimestamp, lastAttemptStatus, message, staleAfterMinutes]
      properties:
        status: { type: string, enum: [healthy, partial, stale, unavailable] }
        lastAttemptAt: { type: ["string", "null"], format: date-time }
        lastSuccessAt: { type: ["string", "null"], format: date-time }
        sourceTimestamp: { type: ["string", "null"], format: date-time }
        lastAttemptStatus: { type: ["string", "null"] }
        message: { type: ["string", "null"] }
        staleAfterMinutes: { type: number }
    ConsumerRecommendation:
      type: object
      required: [status, reason, markets]
      properties:
        status: { type: string, enum: [healthy, partial, stale, unavailable, historical] }
        reason: { type: ["string", "null"] }
        markets:
          type: object
          required: [spread, total, moneyline]
          properties:
            spread: { type: boolean }
            total: { type: boolean }
            moneyline: { type: boolean }
    ConsumerConfidenceComponent:
      type: object
      required: [key, label, score, summary]
      properties:
        key: { type: string, enum: [data, model, marketEdge] }
        label: { type: string }
        score: { type: ["number", "null"] }
        summary: { type: string }
    ConsumerConfidence:
      type: object
      required: [markets]
      properties:
        markets:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [market, score, label, explanation, components, evidence, downgradeReasons, calculatedAt]
            properties:
              market: { type: string, enum: [spread, moneyline, total] }
              score: { type: number }
              label: { type: string, enum: [Low, Moderate, Strong, Very Strong] }
              explanation: { type: string }
              components:
                type: array
                items: { $ref: "#/components/schemas/ConsumerConfidenceComponent" }
              evidence: { type: object, additionalProperties: true }
