            unresolvedRosterIds: { type: array, items: { $ref: "#/components/schemas/VerifiedImageryIssue" } }
            ambiguousIdentities: { type: array, items: { $ref: "#/components/schemas/VerifiedImageryIssue" } }
            duplicateRosterIds: { type: array, items: { $ref: "#/components/schemas/VerifiedImageryIssue" } }
            missingHeadshotUrls: { type: array, items: { $ref: "#/components/schemas/VerifiedImageryIssue" } }
