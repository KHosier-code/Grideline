openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NFL Analytics Model API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: nfl
    description: Live NFL schedule and team data
  - name: dashboard
    description: Dashboard summaries and data freshness
  - name: settings
    description: User-operable model and sportsbook settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get the dashboard overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /data-health:
    get:
      operationId: getDataHealth
      tags: [dashboard]
      summary: Get freshness and availability for each data provider
      responses:
        "200":
          description: Data health status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataHealth"
  /games:
    get:
      operationId: listGames
      tags: [nfl]
      summary: List NFL games for a season and week
      parameters:
        - name: season
          in: query
          required: false
          schema:
            type: integer
            minimum: 2020
        - name: week
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 22
      responses:
        "200":
          description: NFL games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
  /games/{gameId}:
    get:
      operationId: getGame
      tags: [nfl]
      summary: Get one game with current odds and model status
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Game not found
  /games/{gameId}/odds-history:
    get:
      operationId: getOddsHistory
      tags: [nfl]
      summary: Get immutable sportsbook line history for one game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Historical sportsbook observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsHistory"
        "404":
          description: Game not found
  /odds/capture:
    post:
      operationId: captureOdds
      tags: [dashboard]
      summary: Make one explicit Odds API capture
      description: Performs one server-side request only. It never polls or retries and never exposes the API key.
      responses:
        "200":
          description: Capture completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsCaptureResult"
        "502":
          description: Capture failed
  /odds/audit:
    get:
      operationId: listOddsAudits
      tags: [dashboard]
      summary: Read persisted per-event Odds API matching audits
      description: Returns parsed provider fields and matching diagnostics without raw payloads or keyed URLs.
      parameters:
        - name: requestId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [matched_saved, matched_post_kickoff_skipped, unmatched]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: Persisted per-event audits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OddsEventAudit"
  /data-sync/schedule:
    post:
      operationId: syncSchedule
      tags: [nfl]
      summary: Persist the current and next two exposed NFL weeks
      description: Performs an explicit ESPN schedule sync and only upserts games; it never deletes schedule history or calls the Odds API.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleSyncRequest"
      responses:
        "200":
          description: Schedule synchronization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSyncResult"
        "502":
          description: Schedule synchronization failed
  /features/pregame/health:
    get:
      operationId: getPregameFeatureHealth
      tags: [dashboard]
      summary: Read historical pregame feature coverage and limitations
      responses:
        "200":
          description: Feature definition and generated row counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PregameFeatureHealth"
  /features/pregame/game/{gameId}:
    get:
      operationId: getPregameFeaturesForGame
      tags: [nfl]
      summary: Read versioned pregame features for one game
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Team-level pregame feature rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PregameFeatureRow"
  /features/audit:
    get:
      operationId: listPregameFeatureAudit
      tags: [dashboard]
      summary: Read feature values and point-in-time source audit metadata
      parameters:
        - name: season
          in: query
          required: false
          schema: { type: integer }
        - name: week
          in: query
          required: false
          schema: { type: integer }
        - name: gameId
          in: query
          required: false
          schema: { type: string }
        - name: teamId
          in: query
          required: false
          schema: { type: string }
        - name: featureVersion
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Filtered feature audit rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PregameFeatureAuditRow"
  /features/pregame/build:
    post:
      operationId: buildPregameFeatures
      tags: [dashboard]
      summary: Build an immutable version of historical pregame features
      description: Requires authenticated administrator access. Never trains or scores a betting model.
      responses:
        "200":
          description: Feature build result
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /teams:
    get:
      operationId: listTeams
      tags: [nfl]
      summary: List NFL teams
      responses:
        "200":
          description: NFL teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get safe application settings
      responses:
        "200":
          description: Application settings without secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update model and sportsbook settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated application settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Team:
      type: object
      required: [teamId, abbreviation, teamName, conference, division]
      properties:
        teamId: { type: string }
        abbreviation: { type: string }
        teamName: { type: string }
        conference: { type: ["string", "null"] }
        division: { type: ["string", "null"] }
        logoUrl: { type: ["string", "null"] }
    TeamBrief:
      type: object
      required: [abbreviation, teamName]
      properties:
        abbreviation: { type: string }
        teamName: { type: string }
        logoUrl: { type: ["string", "null"] }
    Game:
      type: object
      required:
        [gameId, season, week, gameDate, kickoffTime, homeTeam, awayTeam, gameStatus, venue, modelStatus]
      properties:
        gameId: { type: string }
        season: { type: integer }
        week: { type: integer }
        gameDate: { type: string, format: date-time }
        kickoffTime: { type: ["string", "null"], format: date-time }
        homeTeam: { $ref: "#/components/schemas/TeamBrief" }
        awayTeam: { $ref: "#/components/schemas/TeamBrief" }
        venue: { type: ["string", "null"] }
        finalHomeScore: { type: ["integer", "null"] }
        finalAwayScore: { type: ["integer", "null"] }
        gameStatus: { type: string }
        broadcast: { type: ["string", "null"] }
        modelStatus: { type: string, enum: [not_trained, available] }
        latestOdds: { type: ["array", "null"], items: { $ref: "#/components/schemas/OddsQuote" } }
    OddsQuote:
      type: object
      required: [sportsbook, market, selection, point, price, capturedAt]
      properties:
        sportsbook: { type: string }
        market: { type: string }
        selection: { type: string }
        point: { type: ["number", "null"] }
        price: { type: integer }
        capturedAt: { type: string, format: date-time }
        sourceTimestamp: { type: ["string", "null"], format: date-time }
        observationLabel: { type: string }
    OddsChange:
      type: object
      required:
        [sportsbook, market, selection, capturedAt, previousPoint, point,
         previousPrice, price, pointChanged, priceChanged]
      properties:
        sportsbook: { type: string, enum: [DraftKings, FanDuel] }
        market: { type: string, enum: [spread, moneyline, total] }
        selection: { type: string }
        capturedAt: { type: string, format: date-time }
        sourceTimestamp: { type: ["string", "null"], format: date-time }
        previousPoint: { type: ["number", "null"] }
        point: { type: ["number", "null"] }
        previousPrice: { type: integer }
        price: { type: integer }
        pointChanged: { type: boolean }
        priceChanged: { type: boolean }
    OddsHistory:
      type: object
      required: [gameId, firstObservedAt, firstObservedLabel, firstObserved, current, changes, closing, closingFrozen]
      properties:
        gameId: { type: string }
        firstObservedAt: { type: ["string", "null"], format: date-time }
        firstObservedLabel: { type: ["string", "null"] }
        firstObserved:
          type: array
          items: { $ref: "#/components/schemas/OddsQuote" }
        current:
          type: array
          items: { $ref: "#/components/schemas/OddsQuote" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/OddsChange" }
        closing:
          type: array
          items: { $ref: "#/components/schemas/OddsQuote" }
        closingFrozen: { type: boolean }
    OddsCaptureResult:
      type: object
      required:
        [status, requestedAt, requestId, requestCount, recordsReceived, snapshotsCreated,
         auditedEvents, duplicateSnapshots, unmatchedEvents, skippedPostKickoff,
         missingMarkets, failedSportsbooks, creditsUsed, creditsRemaining, error]
      properties:
        status: { type: string, enum: [success, failed, not_configured, skipped] }
        requestedAt: { type: string, format: date-time }
        requestId: { type: ["integer", "null"] }
        requestCount: { type: integer }
        recordsReceived: { type: integer }
        auditedEvents: { type: integer }
        snapshotsCreated: { type: integer }
        duplicateSnapshots: { type: integer }
        unmatchedEvents: { type: integer }
        skippedPostKickoff: { type: integer }
        missingMarkets:
          type: array
          items: { type: string }
        failedSportsbooks:
          type: array
          items: { type: string }
        creditsUsed: { type: ["integer", "null"] }
        creditsRemaining: { type: ["integer", "null"] }
        skipReason: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
    OddsAuditCandidate:
      type: object
      required: [gridlineGameId, kickoffTime, timeDifferenceMinutes]
      properties:
        gridlineGameId: { type: string }
        kickoffTime: { type: ["string", "null"], format: date-time }
        timeDifferenceMinutes: { type: ["number", "null"] }
    OddsEventAudit:
      type: object
      required:
        [id, requestId, eventIndex, providerEventId, providerHomeTeam,
         providerAwayTeam, providerKickoffTime, normalizedHomeTeam,
         normalizedAwayTeam, candidateGridlineGames, matchedGridlineGameId,
         matchedGridlineKickoff, outcome, reason, observationsReceived,
         observationsSaved, duplicateObservations, rejectedObservations, auditedAt]
      properties:
        id: { type: integer }
        requestId: { type: integer }
        eventIndex: { type: integer }
        providerEventId: { type: ["string", "null"] }
        providerHomeTeam: { type: ["string", "null"] }
        providerAwayTeam: { type: ["string", "null"] }
        providerKickoffTime: { type: ["string", "null"], format: date-time }
        normalizedHomeTeam: { type: ["string", "null"] }
        normalizedAwayTeam: { type: ["string", "null"] }
        candidateGridlineGames:
          type: array
          items: { $ref: "#/components/schemas/OddsAuditCandidate" }
        matchedGridlineGameId: { type: ["string", "null"] }
        matchedGridlineKickoff: { type: ["string", "null"], format: date-time }
        outcome:
          type: string
          enum: [matched_saved, matched_post_kickoff_skipped, unmatched]
        reason:
          type: string
          enum:
            [saved_observation, duplicate_observation, no_observations,
             postkickoff, invalid_fields, no_matching_teams, missing_schedule,
             outside_tolerance, ambiguity, other]
        observationsReceived: { type: integer }
        observationsSaved: { type: integer }
        duplicateObservations: { type: integer }
        rejectedObservations: { type: integer }
        auditedAt: { type: string, format: date-time }
    ScheduleSyncRequest:
      type: object
      properties:
        season: { type: integer, minimum: 2020 }
        currentWeek: { type: integer, minimum: 1, maximum: 22 }
    ScheduleSyncResult:
      type: object
      required: [status, season, currentWeek, weeks, gamesByWeek, totalGames, failures]
      properties:
        status: { type: string, enum: [success, partial, failed] }
        season: { type: integer }
        currentWeek: { type: integer }
        weeks:
          type: array
          items: { type: integer }
        gamesByWeek:
          type: object
          additionalProperties: { type: integer }
        totalGames: { type: integer }
        failures:
          type: array
          items: { type: string }
    DataHealth:
      type: object
      required: [provider, label, status, detail]
      properties:
        provider: { type: string }
        label: { type: string }
        status: { type: string, enum: [current, stale, not_configured, unavailable] }
        detail: { type: string }
        schedule: { type: ["string", "null"] }
        retryPolicy: { type: ["string", "null"] }
        lastUpdated: { type: ["string", "null"], format: date-time }
        nextUpdate: { type: ["string", "null"], format: date-time }
        requestsToday: { type: integer }
        requestsThisMonth: { type: integer }
        remainingQuota: { type: ["string", "null"] }
        metadata:
          type: object
          additionalProperties: true
        scheduledRuns:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledDataHealthRun"
    ScheduledDataHealthRun:
      type: object
      required: [id, provider, status, error, startedAt, completedAt]
      properties:
        id: { type: integer }
        provider: { type: string }
        status: { type: string }
        error: { type: ["string", "null"] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
    PerformanceSummary:
      type: object
      required: [record, winRate, units, roi]
      properties:
        record: { type: string }
        winRate: { type: ["number", "null"] }
        units: { type: ["number", "null"] }
        roi: { type: ["number", "null"] }
    DashboardSummary:
      type: object
      required: [season, currentWeek, gamesThisWeek, modelStatus, ats, moneyline, totals, averageClv]
      properties:
        season: { type: integer }
        currentWeek: { type: ["integer", "null"] }
        gamesThisWeek: { type: integer }
        modelStatus: { type: string }
        ats: { $ref: "#/components/schemas/PerformanceSummary" }
        moneyline: { $ref: "#/components/schemas/PerformanceSummary" }
        totals: { $ref: "#/components/schemas/PerformanceSummary" }
        averageClv: { type: ["number", "null"] }
        topEdges:
          type: array
          items:
            $ref: "#/components/schemas/ModelEdge"
    ModelEdge:
      type: object
      required: [gameId, label, detail]
      properties:
        gameId: { type: string }
        label: { type: string }
        detail: { type: string }
        modelStatus: { type: string }
    AppSettings:
      type: object
      required: [sportsbooks, minimumEdge, minimumConfidence, unitSize, kellyEnabled, oddsApiConfigured]
      properties:
        sportsbooks:
          type: array
          items: { type: string, enum: [DraftKings, FanDuel] }
        minimumEdge: { type: number, minimum: 0 }
        minimumConfidence: { type: number, minimum: 0, maximum: 100 }
        unitSize: { type: number, minimum: 0.1 }
        kellyEnabled: { type: boolean }
        oddsApiConfigured: { type: boolean }
    AppSettingsUpdate:
      type: object
      properties:
        sportsbooks:
          type: array
          items: { type: string, enum: [DraftKings, FanDuel] }
        minimumEdge: { type: number, minimum: 0 }
        minimumConfidence: { type: number, minimum: 0, maximum: 100 }
        unitSize: { type: number, minimum: 0.1 }
        kellyEnabled: { type: boolean }
    PregameFeatureRow:
      type: object
      required: [featureVersion, gameId, teamId, opponentTeamId, season, week, kickoffTime, isHome, features, sampleCounts, featureAudit, lowSample, sourceCutoff]
      properties:
        featureVersion: { type: string }
        gameId: { type: string }
        teamId: { type: string }
        opponentTeamId: { type: string }
        season: { type: integer }
        week: { type: integer }
        kickoffTime: { type: string, format: date-time }
        isHome: { type: boolean }
        features: { type: object, additionalProperties: { type: ["number", "null"] } }
        sampleCounts: { type: object, additionalProperties: { type: integer } }
        featureAudit: { type: object, additionalProperties: true }
        lowSample: { type: boolean }
        sourceCutoff: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
    PregameFeatureHealth:
      type: object
      required: [featureVersion, definition, rows, games, lowSampleRows]
      properties:
        featureVersion: { type: string }
        definition: { type: object, additionalProperties: true }
        rows: { type: integer }
        games: { type: integer }
        lowSampleRows: { type: integer }
        latestGeneratedAt: { type: ["string", "null"], format: date-time }
    PregameFeatureAuditRow:
      type: object
      required: [featureVersion, gameId, teamId, season, week, kickoffTime, featureName, value, sourceDataset, lookbackWindow, gamesIncluded, sampleSize, quality]
      properties:
        featureVersion: { type: string }
        gameId: { type: string }
        teamId: { type: string }
        opponentTeamId: { type: string }
        season: { type: integer }
        week: { type: integer }
        kickoffTime: { type: string, format: date-time }
        featureName: { type: string }
        value: { type: ["number", "null"] }
        sourceDataset: { type: string }
        lookbackWindow: { type: string }
        gamesIncluded: { type: integer }
        lastSourceGame: { type: ["string", "null"] }
        lastSourceDate: { type: ["string", "null"] }
        sampleSize: { type: integer }
        quality: { type: string, enum: [high, low_sample, unavailable] }
        unavailableReason: { type: ["string", "null"] }
