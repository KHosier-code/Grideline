        medianDataConfidence: { type: ["number", "null"] }
        gamesBelow50: { type: integer }
        gamesAbove70: { type: integer }
        publishedStarterCoverage: { type: ["number", "null"] }
        inferredStarterCoverage: { type: ["number", "null"] }
    ChallengerReadinessThreshold:
      type: object
      required: [metric, observed, threshold, pass, interpretation]
      properties:
        metric: { type: string }
        observed: { type: ["number", "boolean", "null"] }
        threshold: { type: ["number", "boolean"] }
        pass: { type: boolean }
        interpretation: { type: string }
    ChallengerSourceFailure:
      type: object
      required: [family, failed, status, latestRunAt, latestSuccessfulRunAt, freshnessBoundHours, reason]
      properties:
        family: { type: string, enum: [personnel, injury, sportsbook, weather] }
        failed: { type: boolean }
        status: { type: string }
        latestRunAt: { type: ["string", "null"], format: date-time }
        latestSuccessfulRunAt: { type: ["string", "null"], format: date-time }
        freshnessBoundHours: { type: integer }
        reason: { type: ["string", "null"] }
    ProductionSchemaControl:
      type: object
      required: [authority, status, scope, migrationLedgerMirrorRequired]
      properties:
        authority: { type: string, const: replit_publish }
        status: { type: string, const: managed_by_replit_publish }
        scope: { type: string, const: tables_columns_indexes }
        migrationLedgerMirrorRequired: { type: boolean, const: false }
    ApplicationWeatherImmutability:
      type: object
      required: [status, persistenceMode, updateDeletePathsAllowed]
      properties:
        status: { type: string, const: enforced }
        persistenceMode: { type: string, const: insert_only }
        updateDeletePathsAllowed: { type: boolean, const: false }
    PointInTimeLeakageProtection:
      type: object
      required: [status, cutoffRule]
      properties:
        status: { type: string, const: enforced }
        cutoffRule: { type: string }
    UnsupportedProductionControl:
      type: object
      required: [control, status, eligibilityImpact, requiredAction]
      properties:
        control: { type: string }
        status:
          type: string
          const: unsupported_by_current_replit_production_migration_path
        eligibilityImpact: { type: string, const: none }
        requiredAction: { type: string }
    ChallengerReadinessReport:
      type: object
      required:
        [evaluationOnly, label, season, week, games, weeklyTrend, thresholds,
         eligible, systematicSourceFailures, failureRule, productionSchema,
         applicationWeatherImmutability, pointInTimeLeakageProtection,
         unsupportedControlLimitations]
      properties:
        evaluationOnly: { type: boolean, const: true }
        label: { type: string }
        season: { type: ["integer", "null"] }
        week: { type: ["integer", "null"] }
        games:
          type: array
          items: { $ref: "#/components/schemas/ChallengerReadinessGame" }
        weeklyTrend:
          type: array
          items: { $ref: "#/components/schemas/ChallengerReadinessWeeklyTrend" }
        thresholds:
          type: array
          items: { $ref: "#/components/schemas/ChallengerReadinessThreshold" }
        eligible: { type: boolean }
        systematicSourceFailures:
          type: array
          items: { $ref: "#/components/schemas/ChallengerSourceFailure" }
        failureRule: { type: string }
        productionSchema: { $ref: "#/components/schemas/ProductionSchemaControl" }
        applicationWeatherImmutability: { $ref: "#/components/schemas/ApplicationWeatherImmutability" }
        pointInTimeLeakageProtection: { $ref: "#/components/schemas/PointInTimeLeakageProtection" }
        unsupportedControlLimitations:
          type: array
          items: { $ref: "#/components/schemas/UnsupportedProductionControl" }
    PregameFeatureBuildInput:
      type: object
      properties:
        featureVersion:
          type: string
          enum: [pregame-v3, pregame-v4-personnel-context]
