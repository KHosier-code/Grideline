openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NFL Analytics Model API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: nfl
    description: Live NFL schedule and team data
  - name: dashboard
    description: Dashboard summaries and data freshness
  - name: settings
    description: User-operable model and sportsbook settings
paths:
  /admin/verified-imagery/report:
    get:
      operationId: getVerifiedImageryReport
      tags: [dashboard]
      summary: Inspect unmatched and ambiguous nflverse imagery evidence
      security: [{ clerk: [] }]
      responses:
        "200":
          description: Source provenance, counts, and unresolved IDs for operator review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifiedImageryReport" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "503": { description: Source evidence unavailable }
  /admin/verified-imagery/candidates/{playerId}/image:
    get:
      operationId: getImageryCandidatePreview
      tags: [dashboard]
      summary: Inspect the current candidate bytes and SHA-256 before deciding
      security: [{ clerk: [] }]
      parameters:
        - { in: path, name: playerId, required: true, schema: { type: string } }
        - { in: query, name: sourceHash, required: true, schema: { type: string } }
      responses:
        "200":
          description: Image bytes with X-Image-SHA256 header
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        "409": { description: Candidate changed }
        "502": { description: Image unavailable }
  /admin/verified-imagery/candidates/{playerId}/history:
    get:
      operationId: getPlayerImageryReviewHistory
      tags: [dashboard]
      summary: Inspect append-only review decisions across source versions
      security: [{ clerk: [] }]
      parameters:
        - { in: path, name: playerId, required: true, schema: { type: string } }
      responses:
        "200":
          description: All prior decisions for this source player
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  required: [id, playerId, provider, sourceHash, imageUrl, imageHash, rightsEvidence, decision, reason, reviewerId, reviewedAt]
                  properties:
                    id: { type: integer }
                    playerId: { type: string }
                    provider: { type: string }
                    sourceHash: { type: string }
                    imageUrl: { type: string }
                    imageHash: { type: string }
                    rightsEvidence: { type: string }
                    decision: { type: string }
                    reason: { type: string }
                    reviewerId: { type: string }
                    reviewedAt: { type: string, format: date-time }
  /admin/verified-imagery/candidates/{playerId}/review:
    post:
      operationId: reviewImageryCandidate
      tags: [dashboard]
      summary: Record an append-only human image identity decision
      security: [{ clerk: [] }]
      parameters:
        - { in: path, name: playerId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceHash, imageHash, decision, reason]
              properties:
                sourceHash: { type: string }
                imageHash: { type: string }
                decision: { type: string, enum: [approved, rejected] }
                reason: { type: string }
      responses:
        "201":
          description: Review recorded
          content:
            application/json:
              schema:
                type: object
                required: [reviewId, decision]
                properties:
                  reviewId: { type: integer }
                  decision: { type: string }
        "400": { description: Invalid review }
        "409": { description: Candidate changed or rights unavailable }
        "503": { description: Review unavailable }
  /verified-imagery/player/{playerId}:
    get:
      operationId: getReviewedPlayerImage
      tags: [nfl]
      summary: Serve only the currently approved image bytes
      parameters:
        - { in: path, name: playerId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Reviewed image
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        "404": { description: No current approved image }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get the dashboard overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /analytics/usage-event:
    post:
      operationId: captureUsageAnalyticsEvent
      tags: [dashboard]
      summary: Capture a privacy-safe Player Usage Lab interaction
      security: [{ clerk: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageAnalyticsEventInput"
      responses:
        "204": { description: Event captured }
        "400": { description: Invalid event }
        "401": { description: Authentication required }
  /admin/usage-analytics:
    get:
      operationId: getUsageAnalyticsSummary
      tags: [dashboard]
      summary: Summarize Player Usage Lab interactions for administrators
      security: [{ clerk: [] }]
      parameters:
        - name: period
          in: query
          required: false
          description: Bounded reporting period ending today (UTC)
          schema:
            type: string
            enum: [7d, 14d, 30d]
            default: 7d
      responses:
        "200":
          description: Usage Lab interaction summary with daily trends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageAnalyticsSummary"
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /data-health:
    get:
      operationId: getDataHealth
      tags: [dashboard]
      summary: Get freshness and availability for each data provider
      responses:
        "200":
          description: Data health status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataHealth"
  /admin/schedule-status-health:
    get:
      operationId: getScheduleStatusHealth
      tags: [health]
      summary: Review unfamiliar persisted schedule statuses
      responses:
        "200":
          description: Bounded status examples and recently affected slates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleStatusHealth"
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "503": { description: Schedule status audit unavailable }
  /admin/sleeper-identity-report:
    get:
      operationId: getSleeperIdentityReport
      tags: [dashboard]
      summary: Read the administrator-only Sleeper identity mapping report
      description: Returns immutable mapping coverage, classification totals, position coverage, all-team depth candidates, a deterministic validation sample, risks, suitability, and safety assertions. Provider diagnostics are never exposed through consumer APIs.
      responses:
        "200":
          description: Sleeper identity mapping and validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleeperIdentityReport"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /games:
    get:
      operationId: listGames
      tags: [nfl]
      summary: List NFL games for a season and week
      parameters:
        - name: season
          in: query
          required: false
          schema:
            type: integer
            minimum: 2020
        - name: week
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 22
      responses:
        "200":
          description: NFL games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
  /games/{gameId}:
    get:
      operationId: getGame
      tags: [nfl]
      summary: Get one game with current odds and model status
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Game not found
  /games/{gameId}/odds-history:
    get:
      operationId: getOddsHistory
      tags: [nfl]
      summary: Get immutable sportsbook line history for one game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Historical sportsbook observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsHistory"
        "404":
          description: Game not found
  /odds/capture:
    post:
      operationId: captureOdds
      tags: [dashboard]
      summary: Make one explicit Odds API capture
      description: Performs one server-side request only. It never polls or retries and never exposes the API key.
      responses:
        "200":
          description: Capture completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsCaptureResult"
        "502":
          description: Capture failed
  /odds/audit:
    get:
      operationId: listOddsAudits
      tags: [dashboard]
      summary: Read persisted per-event Odds API matching audits
      description: Returns parsed provider fields and matching diagnostics without raw payloads or keyed URLs.
      parameters:
        - name: requestId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [matched_saved, matched_post_kickoff_skipped, unmatched]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: Persisted per-event audits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OddsEventAudit"
  /admin/player-recovery/receipts:
    get:
      operationId: listPlayerRecoveryReceipts
      tags: [dashboard]
      summary: Review attested one-shot player recovery receipts
      description: Administrator-only, latest first. Receipts are retained for 90 days and link to data_sync_runs by syncRunJobKey. No provider errors or database identity claims are exposed.
      security: [{ clerk: [] }]
      parameters:
        - name: receiptId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Retained receipts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerRecoveryReceiptsResult" }
        "400": { description: Invalid lookup }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "500": { description: Receipt store unavailable }
  /admin/player-recovery/cleanup-health:
    get:
      operationId: getPlayerRecoveryReceiptCleanupHealth
      tags: [dashboard]
      summary: Review worker-owned player receipt cleanup health and repeated-failure alert
      security: [{ clerk: [] }]
      responses:
        "200":
          description: Privacy-safe cleanup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerRecoveryReceiptCleanupHealth" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "500": { description: Cleanup health unavailable }
  /data-sync/schedule:
    post:
      operationId: syncSchedule
      tags: [nfl]
      summary: Persist the current and next two exposed NFL weeks
      description: Performs an explicit ESPN schedule sync and only upserts games; it never deletes schedule history or calls the Odds API.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleSyncRequest"
      responses:
        "200":
          description: Schedule synchronization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSyncResult"
        "502":
          description: Schedule synchronization failed
  /features/pregame/health:
    get:
      operationId: getPregameFeatureHealth
      tags: [dashboard]
      summary: Read historical pregame feature coverage and limitations
      parameters:
        - name: featureVersion
          in: query
          required: false
          schema: { type: string, enum: [pregame-v3, pregame-v4-personnel-context] }
      responses:
        "200":
          description: Feature definition and generated row counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PregameFeatureHealth"
  /features/pregame/game/{gameId}:
    get:
      operationId: getPregameFeaturesForGame
      tags: [nfl]
      summary: Read versioned pregame features for one game
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Team-level pregame feature rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PregameFeatureRow"
  /features/audit:
    get:
      operationId: listPregameFeatureAudit
      tags: [dashboard]
      summary: Read feature values and point-in-time source audit metadata
      parameters:
        - name: season
          in: query
          required: false
          schema: { type: integer }
        - name: week
          in: query
          required: false
          schema: { type: integer }
        - name: gameId
          in: query
          required: false
          schema: { type: string }
        - name: teamId
          in: query
          required: false
          schema: { type: string }
        - name: featureVersion
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Filtered feature audit rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PregameFeatureAuditRow"
  /features/pregame/build:
    post:
      operationId: buildPregameFeatures
      tags: [dashboard]
      summary: Build an immutable version of historical pregame features
      description: Requires authenticated administrator access. The optional featureVersion pregame-v4-personnel-context creates additive rows from pregame-v3 and never overwrites v3. Never trains or scores a betting model.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PregameFeatureBuildInput"
      responses:
        "200":
          description: Feature build result
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /features/personnel-context/game/{gameId}:
    get:
      operationId: getPersonnelContextForGame
      tags: [dashboard]
      summary: Read auditable point-in-time personnel and context intelligence
      description: Returns probable starters, QB certainty, injury impacts, OL continuity, unit matchups, explicit weather/schedule limitations, immutable market movement, and non-betting data confidence.
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Personnel and context audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonnelContext"
        "404":
          description: Game not found
  /features/personnel-context/audit:
    get:
      operationId: listPersonnelContextAudit
      tags: [dashboard]
      summary: List persisted Phase 7 personnel-context audit rows
      parameters:
        - name: gameId
          in: query
          schema: { type: string }
        - name: teamId
          in: query
          schema: { type: string }
        - name: season
          in: query
          schema: { type: integer }
        - name: week
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: Personnel-context audit rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonnelContextAuditRow"
  /features/personnel-context/coverage:
    get:
      operationId: getPersonnelContextCoverage
      tags: [dashboard]
      summary: Read current-week personnel and weather coverage
      responses:
        "200":
          description: Current-week coverage and source policy assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonnelContextCoverage"
  /features/personnel-context/challenger-readiness:
    get:
      operationId: getChallengerReadinessReport
      tags: [dashboard]
      summary: Read evaluation-only challenger readiness coverage
      description: >
        Returns cutoff-safe personnel coverage for the selected season/week,
        chronological weekly aggregates, bounded persisted feed-health evidence,
        and explicit evaluation-only readiness thresholds. This endpoint never
        trains, promotes, or starts a model and is not betting confidence.
      responses:
        "200":
          description: Challenger readiness report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengerReadinessReport"
  /teams:
    get:
      operationId: listTeams
      tags: [nfl]
      summary: List NFL teams
      responses:
        "200":
          description: NFL teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get safe application settings
      responses:
        "200":
          description: Application settings without secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update model and sportsbook settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated application settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
  /consumer/dashboard:
    get:
      operationId: getConsumerDashboard
      tags: [nfl]
      summary: Read the persisted consumer game dashboard
      description: Returns consumer-safe, persisted data only. It never starts data synchronization or model computation.
      responses:
        "200":
          description: Consumer dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerDashboard"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/schedule-selection:
    get:
      operationId: getConsumerScheduleSelection
      tags: [nfl]
      summary: Select a slate from persisted NFL schedule evidence
      responses:
        "200":
          description: Read-only schedule selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerScheduleSelection"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/games:
    get:
      operationId: listConsumerGames
      tags: [nfl]
      summary: Read consumer-safe persisted games
      description: Returns at most 100 games in kickoff order from persisted data. It never starts synchronization, context builds, prediction generation, or grading.
      parameters:
        - name: season
          in: query
          schema: { type: integer, minimum: 2020 }
        - name: week
          in: query
          schema: { type: integer, minimum: 1, maximum: 22 }
      responses:
        "200":
          description: Consumer games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerGames"
        "400":
          $ref: "#/components/responses/ConsumerInvalidRequest"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/games/{gameId}:
    get:
      operationId: getConsumerGame
      tags: [nfl]
      summary: Read a consumer-safe persisted game detail
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Consumer game detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerGameDetail"
        "404":
          $ref: "#/components/responses/ConsumerGameNotFound"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/games/{gameId}/alerts:
    parameters:
      - name: gameId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getConsumerGameAlerts
      tags: [nfl]
      summary: Check opted-in matchup changes against persisted evidence
      responses:
        "200":
          description: Alert preference and detected changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerGameAlerts" }
        "401":
          description: Sign-in required
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
    put:
      operationId: enableConsumerGameAlerts
      tags: [nfl]
      summary: Opt in to in-app alerts for an upcoming game
      responses:
        "200":
          description: Alerts enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerGameAlerts" }
        "400":
          $ref: "#/components/responses/ConsumerInvalidRequest"
        "401":
          description: Sign-in required
        "404":
          $ref: "#/components/responses/ConsumerGameNotFound"
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
    delete:
      operationId: disableConsumerGameAlerts
      tags: [nfl]
      summary: Disable and clear this game's alerts
      responses:
        "204":
          description: Alerts disabled
        "401":
          description: Sign-in required
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/saved-games/ids:
    get:
      operationId: listSavedGameIds
      tags: [nfl]
      summary: List the signed-in user's saved game IDs
      responses:
        "200":
          description: Saved game IDs
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401":
          description: Sign in required
  /consumer/saved-games:
    get:
      operationId: listSavedGames
      tags: [nfl]
      summary: Read the signed-in user's saved games with current persisted evidence
      responses:
        "200":
          description: Saved games
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsumerGame" }
        "401":
          description: Sign in required
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/saved-games/{gameId}:
    parameters:
      - name: gameId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: saveConsumerGame
      tags: [nfl]
      summary: Save a game for the signed-in user
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/ConsumerInvalidRequest"
        "401":
          description: Sign in required
        "404":
          $ref: "#/components/responses/ConsumerGameNotFound"
        "409":
          description: Saved game limit reached
    delete:
      operationId: removeSavedConsumerGame
      tags: [nfl]
      summary: Remove a game from the signed-in user's saves
      responses:
        "204":
          description: Removed or already absent
        "400":
          $ref: "#/components/responses/ConsumerInvalidRequest"
        "401":
          description: Sign in required
  /consumer/my-picks:
    get:
      operationId: listMyPicks
      tags: [nfl]
      summary: The signed-in user's own moneyline, spread and over/under picks with their record
      responses:
        "200":
          description: Picks and record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerMyPicks" }
        "401":
          description: Sign in required
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/my-picks/{gameId}/{market}:
    parameters:
      - name: gameId
        in: path
        required: true
        schema: { type: string }
      - name: market
        in: path
        required: true
        schema: { type: string, enum: [moneyline, spread, total] }
    put:
      operationId: saveMyPick
      tags: [nfl]
      summary: Make or change a pick before kickoff, locked at the current sportsbook number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side]
              properties:
                side: { type: string, enum: [home, away, over, under] }
      responses:
        "200":
          description: The saved pick
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerMyPick" }
        "400":
          $ref: "#/components/responses/ConsumerInvalidRequest"
        "401":
          description: Sign in required
        "404":
          $ref: "#/components/responses/ConsumerGameNotFound"
        "409":
          description: The game has started or the line isn't posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerError" }
    delete:
      operationId: removeMyPick
      tags: [nfl]
      summary: Remove a pick before kickoff
      responses:
        "204":
          description: Removed or already absent
        "400":
          $ref: "#/components/responses/ConsumerInvalidRequest"
        "401":
          description: Sign in required
        "409":
          description: The game has started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerError" }
  /consumer/team-analytics:
    get:
      operationId: getConsumerTeamAnalytics
      tags: [nfl]
      summary: Read final-game NFLverse team EPA and success-rate observations
      parameters:
        - in: query
          name: season
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - in: query
          name: throughWeek
          required: true
          schema: { type: integer, minimum: 1, maximum: 18 }
        - in: query
          name: window
          required: true
          schema: { type: string, enum: [season, last3, last5, last8], default: season }
        - in: query
          name: teams
          description: Optional comma-separated canonical abbreviations, at most four, for trend selection.
          schema: { type: string }
      responses:
        "200":
          description: Coverage-aware game-mean EPA and per-game team observations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerTeamAnalytics" }
        "400":
          description: Invalid season, week, window, or team selection
        "503":
          $ref: "#/components/responses/ConsumerDataUnavailable"
  /consumer/props:
    get:
      operationId: getConsumerPropsAvailability
      tags: [nfl]
      summary: Read player props availability
      description: Player props are intentionally not available in V1.
      responses:
        "200":
          description: Props placeholder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerPropsAvailability"
  /consumer/player-projections:
    get:
      operationId: getConsumerPlayerProjections
      tags: [nfl]
      summary: Read development-only historical player projection simulations
      description: Historical pregame simulations are not live predictions or betting props.
      responses:
        "200":
          description: Historical simulation or explicit unavailability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPlayerProjections" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/player-projections/upcoming:
    get:
      operationId: getConsumerUpcomingPlayerProjections
      tags: [nfl]
      summary: Read development-only upcoming conditional player projections
      description: >
        Read-only forecasts from the existing frozen player models for players
        eligible for conditional projections. An estimate is conditional on
        participation, is not a guarantee of availability, and is not a betting
        recommendation or production forecast.
      responses:
        "200":
          description: Development forecasts or explicit unavailability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerUpcomingPlayerProjections" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/player-td-forecasts:
    get:
      operationId: getConsumerPlayerTdForecasts
      tags: [nfl]
      summary: Read upcoming player touchdown probability rankings
      description: >
        Development-only touchdown probability estimates ranked within each
        matchup. These are model estimates, not betting advice or odds. Defensive
        context is team-level; individual wide receiver-cornerback assignments
        are not inferred.
      responses:
        "200":
          description: Touchdown forecasts or explicit unavailability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPlayerTdForecasts" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/player-projections/upcoming-readiness:
    get:
      operationId: getConsumerUpcomingPlayerProjectionReadiness
      tags: [nfl]
      summary: Read the development-only upcoming player forecast readiness audit
      description: >
        Read-only audit of the nearest upcoming regular-season week. It never
        generates forecasts. Provider observation timestamps are distinguished
        from ingestion timestamps where the source schema permits.
      responses:
        "200":
          description: Upcoming player forecast readiness, or explicit unavailability outside development
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpcomingPlayerProjectionReadiness" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/defense-vs-position:
    get:
      operationId: getConsumerDefenseVsPosition
      tags: [nfl]
      summary: Read observed regular-season defensive allowances by opposing position
      description: >
        Read-only retrospective history. Final games strictly before a game's kickoff
        are eligible; metric-specific denominators require complete weekly stats and
        PBP evidence for both teams. Last-two-weeks selects the latest two
        schedule-complete weeks before cutoff; last-three and last-five select
        covered games. Missing games within the selected span remain visible.
        Not a forecast or a historical point-in-time source snapshot.
      parameters:
        - name: season
          in: query
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: game
          in: query
          schema: { type: string }
        - name: window
          in: query
          schema: { type: string, enum: [last2Weeks, season, last3, last5], default: last2Weeks }
      responses:
        "200":
          description: Metric-specific game coverage and observed allowance for each defense
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerDefenseVsPosition" }
        "400": { $ref: "#/components/responses/ConsumerInvalidRequest" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/player-position-matchup:
    get:
      operationId: getConsumerPlayerPositionMatchup
      tags: [nfl]
      summary: Compare a player's observed prior appearances with opponent position allowances
      description: >
        Upcoming game only. The score is a descriptive index, never a verified
        predictive score. Projection fields remain unavailable unless separately
        qualified; missing rows are not zero. TD probability has a separate gate.
      parameters:
        - name: game
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: position
          in: query
          required: true
          schema: { type: string, enum: [QB, RB, WR, TE] }
        - name: window
          in: query
          schema: { type: string, enum: [season, last3, last5], default: last5 }
        - name: player
          in: query
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Bounded player choices and selected comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPlayerPositionMatchup" }
        "400": { $ref: "#/components/responses/ConsumerInvalidRequest" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/player-usage:
    get:
      operationId: getConsumerPlayerUsage
      tags: [nfl]
      summary: Read cutoff-safe player usage history
      parameters:
        - name: team
          in: query
          schema: { type: string }
        - name: position
          in: query
          schema: { type: string, enum: [QB, RB, WR, TE] }
        - name: game
          in: query
          schema: { type: string }
        - name: window
          in: query
          schema: { type: string, enum: [last3, last5, last8, season], default: last5 }
      responses:
        "200":
          description: Player usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPlayerUsage" }
        "400": { $ref: "#/components/responses/ConsumerInvalidRequest" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/player-usage-games:
    get:
      operationId: listConsumerPlayerUsageGames
      tags: [nfl]
      summary: List current-season games available as player-usage cutoffs
      description: Returns lightweight persisted schedule rows for the optional Usage Lab game-context selector.
      responses:
        "200":
          description: Player-usage game contexts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPlayerUsageGames" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/red-zone-opportunities:
    get:
      operationId: getConsumerRedZoneOpportunities
      tags: [nfl]
      summary: Read cutoff-safe, source-backed red-zone opportunities
      description: >
        Returns regular-season nflverse play-by-play counts at pre-play yardline
        thresholds 20, 10, and 5 (overlapping zones). Targets include credited
        intended receivers on incomplete passes. Carries follow rush_attempt,
        including credited QB scrambles. Two-point tries, kneels, spikes,
        no-play/nullified plays, and attempts without a credited player ID are
        excluded; missing-ID attempts are also excluded from team denominators.
        last3 uses each player's last three completed appearances identified by
        regular-season player statistics or positive offensive snaps with a
        verified GSIS/PFR crosswalk, across teams before results are partitioned
        into separate playerId/teamId rows. Season and last3 select the
        original completed-appearance window first, then aggregate only games
        with complete team play-by-play and verified player opportunity
        evidence. Missing appearances are excluded from the count and surfaced
        in sourceCoverage rather than treated as zero. Week lists and kickoff
        bounds specify the exact coverage period for each figure.
        sourceUpdatedAt is null when nflverse does not publish a source update
        timestamp. A game parameter sets a pre-kickoff cutoff and excludes that
        game; it does not require prediction or market data.
      parameters:
        - name: season
          in: query
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: team
          in: query
          schema: { type: string }
        - name: position
          in: query
          schema: { type: string, enum: [QB, RB, WR, TE] }
        - name: zone
          in: query
          description: Pre-play yardline_100 threshold; zones overlap.
          schema: { type: integer, enum: [20, 10, 5] }
        - name: period
          in: query
          schema: { type: string, enum: [season, last3], default: season }
        - name: game
          in: query
          description: Gridline game ID used as the excluded-game pre-kickoff cutoff.
          schema: { type: string }
      responses:
        "200":
          description: Player red-zone counts, team shares, and PBP coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerRedZoneOpportunities" }
        "400": { $ref: "#/components/responses/ConsumerInvalidRequest" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/touchdowns:
    get:
      operationId: getConsumerTouchdowns
      tags: [nfl]
      summary: Read anytime-touchdown picks for a week
      description: >
        Latest run of the anytime-TD model for the requested week (default: the
        newest week with picks), ranked by probability, with the season's
        top-10 hit record from graded weeks.
      parameters:
        - name: season
          in: query
          required: false
          schema: { type: integer }
        - name: week
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Touchdown picks or an explicit empty state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerTouchdowns" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/game-projections:
    get:
      operationId: getConsumerGameProjections
      tags: [nfl]
      summary: Read QB-adjusted game projections for a season
      description: >
        For each game, the latest projection from the QB-adjusted rating model
        published before kickoff, plus the straight-up winner record for games
        that are final. Projections, not picks against the spread.
      parameters:
        - name: season
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Projections or an explicit empty state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerGameProjections" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/receipts:
    get:
      operationId: getConsumerReceipts
      tags: [nfl]
      summary: Read every projection and top-5 touchdown pick as locked in before kickoff
      description: >
        Each game's last projection received before kickoff and each week's top
        five touchdown picks, with the time the site received them and the
        result. Runs are append-only; payloads are also committed to the
        public receipts branch of the repository.
      parameters:
        - name: season
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Receipts or an explicit empty state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerReceipts" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/watch-alerts:
    get:
      operationId: getConsumerWatchAlerts
      tags: [nfl]
      summary: Read recent opener-gap watch-list alerts
      parameters:
        - name: hours
          in: query
          required: false
          description: Window in hours (default 3); ignored when since is given
          schema: { type: integer, minimum: 1, maximum: 336 }
        - name: since
          in: query
          required: false
          description: Alerts at or after this time (at most two weeks back)
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Alerts in the window, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerWatchAlerts" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/power-ratings:
    get:
      operationId: getConsumerPowerRatings
      tags: [nfl]
      summary: Read QB-adjusted power ratings and 1-32 stat ranks for every team
      parameters:
        - name: season
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Ratings from the latest model run, or an explicit empty state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPowerRatings" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/usage-report:
    get:
      operationId: getConsumerUsageReport
      tags: [nfl]
      summary: Read the latest weekly player usage, defense vs position and red zone report
      responses:
        "200":
          description: The newest report from the weekly workflow, or an explicit empty state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerUsageReport" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
  /consumer/replay:
    get:
      operationId: getConsumerReplay
      tags: [nfl]
      summary: Read this season's replayed weeks (walk-forward TD top 10 and game winners, graded)
      responses:
        "200":
          description: The newest replay report, or an explicit empty state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerUsageReport" }
        "503": { $ref: "#/components/responses/ConsumerDataUnavailable" }
components:
  responses:
    ConsumerDataUnavailable:
      description: Consumer data is temporarily unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConsumerError" }
    ConsumerInvalidRequest:
      description: Invalid consumer request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConsumerError" }
    ConsumerGameNotFound:
      description: Consumer game unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConsumerError" }
  schemas:
    ConsumerTeamRating:
      type: object
      required: [team, rating, offense, defense, qb, ratingRank, offenseRank, defenseRank, qbRank, qbName, qbValue, qbNewStarter, record, stats, rankChange]
      properties:
        team: { type: string }
        rating: { type: number, description: "Projected margin vs a league-average team on a neutral field" }
        offense: { type: number }
        defense: { type: number }
        qb: { type: number }
        ratingRank: { type: integer }
        offenseRank: { type: integer }
        defenseRank: { type: integer }
        qbRank: { type: integer }
        qbName: { type: ["string", "null"] }
        qbValue: { type: ["number", "null"] }
        qbNewStarter: { type: boolean }
        qbOutName: { type: ["string", "null"] }
        qbOutReason: { type: ["string", "null"] }
        record:
          type: ["object", "null"]
          required: [wins, losses, ties]
          properties:
            wins: { type: integer }
            losses: { type: integer }
            ties: { type: integer }
        stats:
          type: object
          additionalProperties: { type: ["number", "null"] }
        rankChange: { type: ["integer", "null"], description: "Positive when the team moved up since last week" }
    ConsumerUsageReport:
      type: object
      required: [status, season, week, generatedAt, report]
      properties:
        status: { type: string, enum: [available, unavailable] }
        season: { type: ["integer", "null"] }
        week: { type: ["integer", "null"], description: "Last completed week the report covers" }
        generatedAt: { type: ["string", "null"], format: date-time }
        report:
          type: ["object", "null"]
          additionalProperties: true
          description: Players, defenses and redZoneTeams as built by research/td-model/weekly_report.py
    ConsumerPowerRatings:
      type: object
      required: [status, season, week, generatedAt, teams]
      properties:
        status: { type: string, enum: [available, unavailable] }
        season: { type: ["integer", "null"] }
        week: { type: ["integer", "null"] }
        generatedAt: { type: ["string", "null"], format: date-time }
        teams: { type: array, items: { $ref: "#/components/schemas/ConsumerTeamRating" } }
    ConsumerProjectionQb:
      type: object
      required: [name, value, listed, newStarter]
      properties:
        name: { type: ["string", "null"] }
        value: { type: ["number", "null"], description: "Recency-weighted EPA per dropback, shrunk toward backup level" }
        listed: { type: boolean, description: "True when the schedule lists this QB as the starter; false when inferred from recent starts" }
        newStarter: { type: boolean, description: "Not the team's usual starter over its last four games" }
        outName: { type: ["string", "null"], description: "The usual or listed starter, when ruled out by the injury report or roster" }
        outReason: { type: ["string", "null"], description: "Why outName is not expected to play, such as Out or Injured reserve" }
    ConsumerGameProjection:
      type: object
      required: [gameId, nflverseGameId, homeTeam, awayTeam, kickoff, projectedMargin, projectedTotal, homeWinProbability, homeQb, awayQb, factors, projectedAt]
      properties:
        gameId: { type: string }
        nflverseGameId: { type: string }
        homeTeam: { type: string }
        awayTeam: { type: string }
        kickoff: { type: ["string", "null"], format: date-time }
        projectedMargin: { type: number, description: "Home minus away" }
        projectedTotal: { type: number }
        homeWinProbability: { type: number }
        marketMargin: { type: ["number", "null"], description: "Consensus betting line as an expected home margin (positive favors home), from nflverse" }
        marketTotal: { type: ["number", "null"], description: "Consensus betting total, from nflverse" }
        homeQb: { $ref: "#/components/schemas/ConsumerProjectionQb" }
        awayQb: { $ref: "#/components/schemas/ConsumerProjectionQb" }
        factors:
          type: object
          required: [qbEdge, teamEdge, passEdge, rushEdge, restDiff, neutralSite]
          properties:
            qbEdge: { type: ["number", "null"] }
            teamEdge: { type: ["number", "null"] }
            passEdge: { type: ["number", "null"] }
            rushEdge: { type: ["number", "null"] }
            restDiff: { type: ["number", "null"] }
            neutralSite: { type: boolean }
        projectedAt: { type: string, format: date-time }
        lockedAt: { type: string, format: date-time, description: "When the site received this projection (it only counts for games that start after this)" }
        books: { type: array, items: { $ref: "#/components/schemas/ConsumerBookLines" } }
    ConsumerBookQuote:
      type: ["object", "null"]
      required: [point, price]
      properties:
        point: { type: ["number", "null"] }
        price: { type: integer }
    ConsumerBookLines:
      type: object
      description: One sportsbook's latest saved lines for a game
      required: [sportsbook, capturedAt, homeSpread, awaySpread, homeMoneyline, awayMoneyline, over, under]
      properties:
        sportsbook: { type: string }
        capturedAt: { type: string, format: date-time }
        homeSpread: { $ref: "#/components/schemas/ConsumerBookQuote" }
        awaySpread: { $ref: "#/components/schemas/ConsumerBookQuote" }
        homeMoneyline: { type: ["integer", "null"] }
        awayMoneyline: { type: ["integer", "null"] }
        over: { $ref: "#/components/schemas/ConsumerBookQuote" }
        under: { $ref: "#/components/schemas/ConsumerBookQuote" }
    ConsumerWatchGame:
      type: object
      required: [gameId, homeTeam, awayTeam, kickoff, sportsbook, gridlineMargin, lockedAt, openLine, openedAt, publishedLine, currentLine, currentAt, started, gap, side, movedToward, atsOpen, atsPublished, atsClose]
      properties:
        gameId: { type: string }
        homeTeam: { type: string }
        awayTeam: { type: string }
        kickoff: { type: string, format: date-time }
        sportsbook: { type: string }
        gridlineMargin: { type: number, description: "Gridline's expected home margin in its first projection before kickoff" }
        lockedAt: { type: string, format: date-time }
        openLine: { type: number, description: "Opening home spread (negative when home is favored)" }
        openedAt: { type: string, format: date-time }
        publishedLine: { type: number, description: "Home spread when Gridline's projection went up" }
        currentLine: { type: number, description: "Latest home spread before kickoff (the closing line once started)" }
        currentAt: { type: string, format: date-time }
        started: { type: boolean }
        gap: { type: number }
        side: { type: string, enum: [home, away] }
        movedToward: { type: number, description: "Points the line moved toward Gridline's side since the opener" }
        atsOpen: { type: ["string", "null"], enum: [win, loss, push, null] }
        atsPublished: { type: ["string", "null"], enum: [win, loss, push, null] }
        atsClose: { type: ["string", "null"], enum: [win, loss, push, null] }
    ConsumerWatchList:
      type: object
      description: Games where Gridline's first pregame line is `threshold`+ points off the opening spread
      required: [threshold, flagged, graded, movedToward, movedAway, atsOpen, atsPublished, atsClose, games]
      properties:
        threshold: { type: number }
        flagged: { type: integer }
        graded: { type: integer }
        movedToward: { type: integer }
        movedAway: { type: integer }
        atsOpen: { $ref: "#/components/schemas/ConsumerRecordLine" }
        atsPublished: { $ref: "#/components/schemas/ConsumerRecordLine" }
        atsClose: { $ref: "#/components/schemas/ConsumerRecordLine" }
        games: { type: array, items: { $ref: "#/components/schemas/ConsumerWatchGame" } }
    ConsumerWatchAlerts:
      type: object
      required: [alerts, ntfyTopic]
      properties:
        ntfyTopic: { type: ["string", "null"], description: "ntfy.sh topic that receives these alerts as phone notifications, when configured" }
        alerts:
          type: array
          items:
            type: object
            required: [kind, gameId, at, message]
            properties:
              kind: { type: string, enum: [flagged, moved-toward, moved-away] }
              gameId: { type: string }
              at: { type: string, format: date-time }
              message: { type: string }
    ConsumerReceipts:
      type: object
      required: [status, season, seasons, games, touchdowns, runs]
      properties:
        status: { type: string, enum: [available, unavailable] }
        season: { type: ["integer", "null"] }
        seasons: { type: array, items: { type: integer } }
        games:
          type: array
          items:
            type: object
            required: [week, gameId, homeTeam, awayTeam, kickoff, lockedAt, projectedMargin, projectedTotal, homeWinProbability, line, final, winner]
            properties:
              week: { type: ["integer", "null"] }
              gameId: { type: string }
              homeTeam: { type: string }
              awayTeam: { type: string }
              kickoff: { type: ["string", "null"], format: date-time }
              lockedAt: { type: string, format: date-time }
              projectedMargin: { type: number }
              projectedTotal: { type: number }
              homeWinProbability: { type: number }
              line:
                type: ["object", "null"]
                description: The sportsbook spread saved at or before the lock time
                required: [sportsbook, homeLine, capturedAt]
                properties:
                  sportsbook: { type: string }
                  homeLine: { type: number }
                  capturedAt: { type: string, format: date-time }
              final:
                type: ["object", "null"]
                required: [home, away]
                properties:
                  home: { type: integer }
                  away: { type: integer }
              winner: { type: ["string", "null"], enum: [win, loss, push, null] }
        touchdowns:
          type: array
          items:
            type: object
            required: [week, rank, playerId, name, position, team, opponent, kickoff, probability, lockedAt, scored]
            properties:
              week: { type: integer }
              rank: { type: integer }
              playerId: { type: string }
              name: { type: string }
              position: { type: string }
              team: { type: string }
              opponent: { type: string }
              kickoff: { type: ["string", "null"], format: date-time }
              probability: { type: number }
              lockedAt: { type: string, format: date-time }
              scored: { type: ["boolean", "null"] }
        runs:
          type: array
          items:
            type: object
            required: [kind, week, generatedAt, receivedAt]
            properties:
              kind: { type: string, enum: [games, touchdowns] }
              week: { type: integer }
              generatedAt: { type: string, format: date-time }
              receivedAt: { type: string, format: date-time }
    ConsumerGameProjections:
      type: object
      required: [status, season, modelVersion, generatedAt, evaluation, games, record, favoriteRecord, lineValue, watch, weeks]
      properties:
        status: { type: string, enum: [available, unavailable] }
        season: { type: ["integer", "null"] }
        modelVersion: { type: ["string", "null"] }
        generatedAt: { type: ["string", "null"], format: date-time }
        evaluation:
          type: object
          additionalProperties: true
          properties:
            marginMissRating: { type: number }
            marginMissLine: { type: number }
            winnersModel: { type: number }
            winnersFavorite: { type: number }
            atsRating: { type: number }
            totalMissRating: { type: number }
            totalMissLine: { type: number }
            testedOn: { type: string }
            seasons:
              type: array
              items:
                type: object
                additionalProperties: true
                properties:
                  season: { type: integer }
                  games: { type: integer }
                  mae_rating: { type: number }
                  mae_market_aware: { type: number }
                  mae_line: { type: number }
                  winners_model: { type: number }
                  winners_favorite: { type: number }
                  ats_wins: { type: integer }
                  ats_losses: { type: integer }
                  ats_pushes: { type: integer }
                  total_miss_rating: { type: number }
                  total_miss_line: { type: number }
        games: { type: array, items: { $ref: "#/components/schemas/ConsumerGameProjection" } }
        record: { $ref: "#/components/schemas/ConsumerRecordLine" }
        favoriteRecord:
          description: Straight-up record of the betting favorite on the same games, for comparison with `record`.
          $ref: "#/components/schemas/ConsumerRecordLine"
        lineValue: { $ref: "#/components/schemas/ConsumerLineValue" }
        watch: { $ref: "#/components/schemas/ConsumerWatchList" }
        weeks:
          type: array
          items:
            type: object
            required: [week, wins, losses, pushes]
            properties:
              week: { type: integer }
              wins: { type: integer }
              losses: { type: integer }
              pushes: { type: integer }
    ConsumerLineValue:
      type: object
      description: >-
        Closing line value. For each game with a saved opening and closing spread
        at one book, Gridline's line when the opener was captured is compared with
        the opener; a lean is Gridline disagreeing by at least `threshold` points.
      required: [games, leans, threshold, movedToward, movedAway, unchanged, averageMove, atsOpen, atsClose]
      properties:
        games: { type: integer }
        leans: { type: integer }
        threshold: { type: number }
        movedToward: { type: integer, description: Leans where the line closed closer to Gridline's side than it opened. }
        movedAway: { type: integer }
        unchanged: { type: integer }
        averageMove: { type: ["number", "null"], description: Average points the line moved toward Gridline's lean. }
        atsOpen: { $ref: "#/components/schemas/ConsumerRecordLine" }
        atsClose: { $ref: "#/components/schemas/ConsumerRecordLine" }
    ConsumerRecordLine:
      type: object
      required: [wins, losses, pushes]
      properties:
        wins: { type: integer }
        losses: { type: integer }
        pushes: { type: integer }
    ConsumerTouchdownFactors:
      type: object
      required: [targetsPerGame, carriesPerGame, targetShare, carryShare, redZoneTouchesPerGame, redZoneShare, goalLineShare, teamImpliedPoints, opponentTdsAllowedRatio, recentTdRate]
      properties:
        targetsPerGame: { type: ["number", "null"] }
        carriesPerGame: { type: ["number", "null"] }
        targetShare: { type: ["number", "null"] }
        carryShare: { type: ["number", "null"] }
        redZoneTouchesPerGame: { type: ["number", "null"] }
        redZoneShare: { type: ["number", "null"] }
        goalLineShare: { type: ["number", "null"] }
        teamImpliedPoints: { type: ["number", "null"] }
        opponentTdsAllowedRatio: { type: ["number", "null"] }
        recentTdRate: { type: ["number", "null"] }
    ConsumerTouchdownPick:
      type: object
      required: [rank, playerId, name, position, team, opponent, isHome, kickoff, probability, fairOdds, injuryStatus, factors, scored, expectedValue, value]
      properties:
        rank: { type: integer }
        playerId: { type: string }
        name: { type: string }
        position: { type: string, enum: [QB, RB, WR, TE] }
        team: { type: string }
        opponent: { type: string }
        isHome: { type: boolean }
        kickoff: { type: ["string", "null"], format: date-time }
        probability: { type: number }
        fairOdds: { type: integer }
        injuryStatus: { type: ["string", "null"] }
        factors: { $ref: "#/components/schemas/ConsumerTouchdownFactors" }
        scored: { type: ["boolean", "null"], description: "null until the game is graded" }
        bookOdds:
          type: ["object", "null"]
          description: Best DraftKings or FanDuel anytime-TD price from the latest capture, when the player was listed
          required: [price, book, books, capturedAt]
          properties:
            price: { type: integer }
            book: { type: string }
            books:
              type: array
              items:
                type: object
                required: [book, price]
                properties:
                  book: { type: string }
                  price: { type: integer }
            capturedAt: { type: string, format: date-time }
        expectedValue:
          type: ["number", "null"]
          description: Expected profit per 1 unit staked at the best book price, using our probability; null without a price
        value:
          type: boolean
          description: A top-5 pick whose best book price pays more than our probability says it should
    ConsumerTouchdownValueRecord:
      type: object
      required: [picks, hits, units, weeks]
      description: Graded value picks this season, 1 unit each at the captured price
      properties:
        picks: { type: integer }
        hits: { type: integer }
        units: { type: number }
        weeks:
          type: array
          items:
            type: object
            required: [week, picks, hits, units]
            properties:
              week: { type: integer }
              picks: { type: integer }
              hits: { type: integer }
              units: { type: number }
    ConsumerTouchdownRecord:
      type: object
      required: [weeksGraded, topTenPicks, topTenHits, weeks]
      properties:
        weeksGraded: { type: integer }
        topTenPicks: { type: integer }
        topTenHits: { type: integer }
        weeks:
          type: array
          items:
            type: object
            required: [week, picks, hits]
            properties:
              week: { type: integer }
              picks: { type: integer }
              hits: { type: integer }
    ConsumerTouchdowns:
      type: object
      required: [status, season, week, generatedAt, modelVersion, evaluation, picks, weeks, record, valueRecord, bookComparison]
      properties:
        status: { type: string, enum: [available, unavailable] }
        season: { type: ["integer", "null"] }
        week: { type: ["integer", "null"] }
        generatedAt: { type: ["string", "null"], format: date-time }
        modelVersion: { type: ["string", "null"] }
        evaluation:
          type: object
          required: [topTenHitRate, auc, testedOn]
          properties:
            topTenHitRate: { type: ["number", "null"] }
            auc: { type: ["number", "null"] }
            testedOn: { type: ["string", "null"] }
        picks: { type: array, items: { $ref: "#/components/schemas/ConsumerTouchdownPick" } }
        weeks:
          type: array
          items:
            type: object
            required: [season, week]
            properties:
              season: { type: integer }
              week: { type: integer }
        record: { $ref: "#/components/schemas/ConsumerTouchdownRecord" }
        valueRecord: { $ref: "#/components/schemas/ConsumerTouchdownValueRecord" }
        bookComparison: { $ref: "#/components/schemas/ConsumerTouchdownBookComparison" }
    ConsumerTouchdownBookComparison:
      type: object
      description: >-
        Our probability against the books' (best-effort de-vig: average implied
        chance across DraftKings and FanDuel divided by 1 + hold) on every graded
        board player both priced. Lower Brier score and log loss are better.
      required: [players, weeks, scored, modelAverage, bookAverage, modelBrier, bookBrier, modelLogLoss, bookLogLoss, hold]
      properties:
        players: { type: integer }
        weeks: { type: integer }
        scored: { type: integer }
        modelAverage: { type: ["number", "null"] }
        bookAverage: { type: ["number", "null"] }
        modelBrier: { type: ["number", "null"] }
        bookBrier: { type: ["number", "null"] }
        modelLogLoss: { type: ["number", "null"] }
        bookLogLoss: { type: ["number", "null"] }
        hold: { type: number }
    ScheduleStatusHealth:
      type: object
      required: [unknownCount, examples, recentSlates, supportedCategories, guidance]
      properties:
        unknownCount: { type: integer }
        examples:
          type: array
          maxItems: 5
          items:
            type: object
            required: [status, count, season, week]
            properties:
              status: { type: string, maxLength: 48 }
              count: { type: integer }
              season: { type: integer }
              week: { type: integer }
        recentSlates:
          type: array
          maxItems: 8
          items:
            type: object
            required: [season, week, count]
            properties:
              season: { type: integer }
              week: { type: integer }
              count: { type: integer }
        supportedCategories:
          type: array
          items: { type: string, enum: [scheduled, live, terminal] }
        guidance: { type: string }
