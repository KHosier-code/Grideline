name: Pools data probe (one-off)

# One-off: checks which free sources have bowl lines and public pick
# percentages for the pool tools. Prints to the log only; removed after.
on:
  push:
    branches: [claude/beautiful-mendel-t4wvmz]
    paths: [.github/workflows/pools-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bowl games and lines (ESPN scoreboard, last season's postseason)
        run: |
          u="https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?dates=20251213-20260120&seasontype=3&groups=80&limit=100"
          curl -sS -m 60 "$u" -o sb.json -w "scoreboard %{http_code} %{size_download}B\n" || true
          jq -r '"events: \(.events|length)"' sb.json || true
          jq -r '.events[:6][] | "\(.date[:10]) \(.name) | \(.competitions[0].notes[0].headline // "-") | odds: \(.competitions[0].odds[0].details // "none") ml \(.competitions[0].odds[0].moneyline.home.close.odds // .competitions[0].odds[0].homeTeamOdds.moneyLine // "-") | final \(.competitions[0].status.type.completed)"' sb.json || true
          jq -r '[.events[] | select(.competitions[0].odds[0].details != null)] | length | "with odds: \(.)"' sb.json || true
      - name: Public pick percentages (ESPN Gambit challenges)
        run: |
          for key in college-bowl-mania-2025 college-football-bowl-mania-2025 bowl-mania-2025 tournament-challenge-bracket-2026 tournament-challenge-bracket-2025; do
            u="https://gambit-api.fantasy.espn.com/apis/v1/challenges/$key?platform=chui&view=chui_default"
            code=$(curl -sS -m 60 -o c.json -w '%{http_code}' "$u" || echo 000)
            echo "== $key: HTTP $code $(wc -c < c.json) bytes"
            [ "$code" = "200" ] || { head -c 200 c.json; echo; continue; }
            jq -r '"name: \(.name // "-") | state: \(.state // "-") | propositions: \(.propositions|length // 0) | keys: \(keys|join(","))"' c.json || true
            jq -c '.propositions[0] | {name, date, status, outcomes: [.possibleOutcomes[]? | {name, abbrev, counters: .choiceCounters, mappings: (.mappings // [] | map(.type) )}]}' c.json 2>/dev/null | head -c 1500; echo
            jq -c '[.propositions[]? | {name, pct: [.possibleOutcomes[]? | (.choiceCounters[0].percentage // null)]}] | .[:5]' c.json 2>/dev/null | head -c 800; echo
          done
