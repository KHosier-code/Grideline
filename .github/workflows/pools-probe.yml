name: Pools data probe (one-off)

# One-off: which Bowl Mania scoring format is which, and whether ESPN's
# scoreboard has bowl lines. Log output only; removed after.
on:
  push:
    branches: [claude/beautiful-mendel-t4wvmz]
    paths: [.github/workflows/pools-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bowl Mania format metadata
        run: |
          curl -sS -m 60 -o c.json "https://gambit-api.fantasy.espn.com/apis/v1/challenges/college-football-bowl-mania-2025?platform=chui&view=chui_default"
          echo "--- challenge minus propositions"
          jq -c 'del(.propositions)' c.json | head -c 5000; echo
          echo "--- one outcome without mappings"
          jq -c '.propositions[0].possibleOutcomes[0] | del(.mappings)' c.json | head -c 1500; echo
          echo "--- spread overrides that differ from the winner"
          jq -c '[.propositions[] | select(.correctOutcomeOverrides.SPREAD != null and .correctOutcomeOverrides.SPREAD != .correctOutcomes[0]) | {n: .name, win: .correctOutcomes[0], ats: .correctOutcomeOverrides.SPREAD, o: [.possibleOutcomes[] | {id, a: .abbrev, p: [.choiceCounters[] | {f: .scoringFormatId, pct: (.percentage*1000|round/1000), count}]}]}] | .[:3]' c.json | head -c 3000; echo
      - name: ESPN scoreboard bowl lines
        run: |
          for q in "seasontype=3&week=1&groups=80&limit=100&dates=2025" "dates=20251227&groups=80&limit=50" "seasontype=3&groups=80&limit=100"; do
            code=$(curl -sS -m 60 -o sb.json -w '%{http_code}' "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?$q" || echo 000)
            echo "== $q HTTP $code"
            [ "$code" = "200" ] || { head -c 200 sb.json; echo; continue; }
            jq -r '"events \(.events|length)"' sb.json
            jq -r '.events[:3][] | "\(.date[:10]) \(.name) | \(.competitions[0].notes[0].headline // "-") | odds: \(.competitions[0].odds[0].details // "none") / ou \(.competitions[0].odds[0].overUnder // "-") | provider \(.competitions[0].odds[0].provider.name // "-")"' sb.json
          done
