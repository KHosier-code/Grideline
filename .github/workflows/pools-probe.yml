name: Pools data probe (one-off)

# One-off: runs the bowl job against ESPN for last season (no upload) and for
# this season (should find nothing yet). Removed after.
on:
  push:
    branches: [claude/beautiful-mendel-t4wvmz]
    paths: [.github/workflows/pools-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/pools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3
      - name: Last season, live fetch, no upload
        run: |
          python bowls_daily.py --season 2025 --out p.json
          python -c "import json; p=json.load(open('p.json')); g=p['games']; print('crowd', p['crowd']); print('first', p['firstKickoff']); [print(x['bowl'], '|', x['teams'][0]['name'], 'vs', x['teams'][1]['name'], '|', round(x['winA'],3), x['lineSource'], '| logo', bool(x['teams'][0]['logo'])) for x in g[:5]]; s=p['sheets']['confidence-25-mixed']; print('sheet', s['win'], s['chalkWin'], s['fair'])"
      - name: This season (matchups not set yet)
        run: python bowls_daily.py --season 2026 --sims 300 --check-sims 600
