name: Weekly picks

# Runs Gridline's two models on fresh nflverse data and sends the results to
# the site: anytime-TD picks (research/td-model) and QB-adjusted game
# projections (research/game-model). Each run also commits what it sent to
# the public `receipts` branch (the Receipts page links there) and posts any
# new watch-list alerts. Times are UTC (ET + 4 during the season).
on:
  schedule:
    - cron: "0 14 * * 2"   # Tue 10:00 ET  - first look after Monday night
    - cron: "0 15 * * 4"   # Thu 11:00 ET  - before Thursday night
    - cron: "0 22 * * 5"   # Fri 18:00 ET  - after the final injury report
    - cron: "0 15 * * 6"   # Sat 11:00 ET
    - cron: "30 14 * * 0"  # Sun 10:30 ET  - before the 1:00 games
    - cron: "45 15 * * 0"  # Sun 11:45 ET  - after 1:00 inactives post (QB changes, late scratches)
    - cron: "15 23 * * 0"  # Sun 19:15 ET  - before Sunday night
    - cron: "0 23 * * 1"   # Mon 19:00 ET  - before Monday night
  workflow_dispatch: {}

concurrency:
  group: weekly-picks
  cancel-in-progress: false

permissions:
  contents: write   # push to the receipts branch

env:
  GRIDLINE_INGEST_URL: ${{ secrets.GRIDLINE_INGEST_URL }}
  GRIDLINE_INGEST_TOKEN: ${{ secrets.GRIDLINE_INGEST_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Note the start time
        run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/td-model/requirements.txt
      - run: pip install -r research/td-model/requirements.txt
      - name: Download nflverse data
        working-directory: research/td-model
        run: ./fetch_data.sh
      - name: Touchdown picks
        id: touchdowns
        working-directory: research/td-model
        run: |
          python build_dataset.py data td_dataset.parquet
          python evaluate.py td_dataset.parquet metrics.json
          python publish.py td_dataset.parquet data metrics.json
      - name: Share card
        if: ${{ !cancelled() }}
        working-directory: research/td-model
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/SpaceGrotesk.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" || true
          curl -fsSL -o fonts/InstrumentSans.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/instrumentsans/InstrumentSans%5Bwdth,wght%5D.ttf" || true
          python share_card.py td_payload.json
      - name: Animated share clip
        if: ${{ !cancelled() && steps.touchdowns.outcome == 'success' }}
        # A missing clip never holds up the picks.
        continue-on-error: true
        working-directory: research/td-model
        run: python share_clip.py td_payload.json td_clip.mp4
      - name: Usage, defense vs position and red zone report
        if: ${{ !cancelled() }}
        working-directory: research/td-model
        run: python weekly_report.py data
      - name: Game projections
        id: games
        if: ${{ !cancelled() }}
        working-directory: research/game-model
        run: |
          python build_games.py ../td-model/data games.parquet
          python team_stats.py ../td-model/data team_stats.parquet
          python evaluate_games.py games.parquet metrics.json
          python publish_games.py games.parquet metrics.json team_stats.parquet
      - name: Save receipts
        if: ${{ !cancelled() && env.GRIDLINE_INGEST_URL != '' }}
        env:
          TOUCHDOWNS: ${{ steps.touchdowns.outcome }}
          GAMES: ${{ steps.games.outcome }}
        run: ./.github/scripts/save-receipts.sh
      - name: Send watch-list alerts
        if: ${{ !cancelled() }}
        run: ./.github/scripts/send-watch-alerts.sh
      - name: Replay this season's completed weeks
        if: ${{ !cancelled() }}
        working-directory: research
        run: python replay.py td-model/td_dataset.parquet game-model/games.parquet
