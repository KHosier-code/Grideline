name: Odds

# Asks the site to capture DraftKings and FanDuel lines (moneyline, spread,
# total) with its own Odds API key. Each capture costs 3 credits; this schedule
# is 10 captures a week (about 130 credits a month). Thursday and Saturday
# mornings also capture anytime-TD prices, 1 credit per game (about 70 a
# month), for a total near 200 of the free 500.
# Every capture saves all upcoming games, so the late-Sunday run records next
# week's lines soon after books post them: the true opener. Model Performance
# grades closing line value from the first and last capture before kickoff.
# Times are UTC (ET + 4 during daylight time, + 5 after early November).
on:
  schedule:
    - cron: "7 3 * * 1"     # Sun 23:07 ET  - next week's opening lines
    - cron: "7 14 * * 2"    # Tue 10:07 ET  - lines after Monday night
    - cron: "7 14 * * 4"    # Thu 10:07 ET
    - cron: "37 23 * * 4"   # Thu 19:37 ET  - before Thursday night
    - cron: "7 14 * * 6"    # Sat 10:07 ET
    - cron: "7 12 * * 0"    # Sun 08:07 ET  - before London / early games
    - cron: "22 16 * * 0"   # Sun 12:22 ET  - before the 1:00 games
    - cron: "27 19 * * 0"   # Sun 15:27 ET  - before the late games
    - cron: "42 23 * * 0"   # Sun 19:42 ET  - before Sunday night
    - cron: "37 23 * * 1"   # Mon 19:37 ET  - before Monday night
  workflow_dispatch: {}

concurrency:
  group: odds
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture sportsbook lines
        env:
          GRIDLINE_INGEST_URL: ${{ secrets.GRIDLINE_INGEST_URL }}
          GRIDLINE_INGEST_TOKEN: ${{ secrets.GRIDLINE_INGEST_TOKEN }}
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GRIDLINE_INGEST_TOKEN" \
            "${GRIDLINE_INGEST_URL%/}/api/odds/scheduled-capture")
          cat response.json; echo
          [ "$status" -lt 400 ]
      - name: Capture anytime-TD prices
        if: github.event.schedule == '7 14 * * 4' || github.event.schedule == '7 14 * * 6'
        env:
          GRIDLINE_INGEST_URL: ${{ secrets.GRIDLINE_INGEST_URL }}
          GRIDLINE_INGEST_TOKEN: ${{ secrets.GRIDLINE_INGEST_TOKEN }}
          # Thursday: tonight's game only. Saturday: Sunday and Monday.
          HOURS: ${{ github.event.schedule == '7 14 * * 4' && '14' || '62' }}
        run: |
          status=$(curl -sS -o props.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GRIDLINE_INGEST_TOKEN" \
            "${GRIDLINE_INGEST_URL%/}/api/odds/td-props-capture?hours=$HOURS")
          cat props.json; echo
          [ "$status" -lt 400 ]
