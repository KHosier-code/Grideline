name: Stats

# Asks the site to import this season's nflverse play-by-play, player stats,
# snap counts and depth charts. Team charts count a week only once every game
# has team stats, so this keeps them current. nflverse posts each game's data
# overnight; Tuesday catches Monday night, Wednesday and Thursday catch late
# corrections. Free, no key. Times are UTC (ET + 4 during daylight time).
on:
  schedule:
    - cron: "23 14 * * 2"   # Tue 10:23 ET
    - cron: "23 14 * * 3"   # Wed 10:23 ET
    - cron: "23 14 * * 4"   # Thu 10:23 ET
  workflow_dispatch: {}

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Import this season's stats
        env:
          GRIDLINE_INGEST_URL: ${{ secrets.GRIDLINE_INGEST_URL }}
          GRIDLINE_INGEST_TOKEN: ${{ secrets.GRIDLINE_INGEST_TOKEN }}
        run: |
          base="${GRIDLINE_INGEST_URL%/}/api/nflverse"
          auth="Authorization: Bearer $GRIDLINE_INGEST_TOKEN"
          status=$(curl -sS -o start.json -w '%{http_code}' -X POST -H "$auth" "$base/scheduled-refresh")
          cat start.json; echo
          [ "$status" -lt 400 ] || exit 1
          # The import runs on the site; follow it until it finishes.
          for i in $(seq 1 50); do
            sleep 30
            curl -sS -H "$auth" "$base/refresh-status" -o run.json || continue
            state=$(jq -r .status run.json)
            echo "$(date -u +%H:%M:%S) $state"
            case "$state" in
              success) cat run.json; echo; exit 0 ;;
              failed|partial) cat run.json; echo; exit 1 ;;
            esac
          done
          echo "Import still running after 25 minutes"; exit 1
