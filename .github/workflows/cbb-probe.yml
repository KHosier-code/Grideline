name: College basketball ESPN samples (research)

# One-off: saves sample ESPN responses (scoreboard, game summary, roster,
# upcoming-game odds) so the daily college job can be written against the
# real formats. Results go to research/cbb-model/samples/.
on:
  push:
    paths:
      - .github/workflows/cbb-probe.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch samples
        run: |
          mkdir -p research/cbb-model/samples && cd research/cbb-model/samples
          B=https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball
          curl -sS "$B/scoreboard?dates=20260301&groups=50&limit=400" -o scoreboard_past.json
          curl -sS "$B/scoreboard?dates=20261102&groups=50&limit=400" -o scoreboard_upcoming.json
          curl -sS "$B/scoreboard?dates=20261017&groups=50&limit=400" -o scoreboard_today.json
          ID=$(python3 -c "import json;print(json.load(open('scoreboard_past.json'))['events'][0]['id'])")
          curl -sS "$B/summary?event=$ID" -o summary_past.json
          UP=$(python3 -c "import json;e=json.load(open('scoreboard_upcoming.json'))['events'];print(e[0]['id'] if e else '')")
          [ -n "$UP" ] && curl -sS "$B/summary?event=$UP" -o summary_upcoming.json
          curl -sS "$B/teams/150/roster" -o roster_duke.json
          curl -sS "$B/teams?limit=500&groups=50" -o teams.json
          curl -sS "https://sports.core.api.espn.com/v2/sports/basketball/leagues/mens-college-basketball/events/$ID/competitions/$ID/odds" -o core_odds_past.json
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add research/cbb-model/samples
          git commit -m "College basketball: sample ESPN responses (research)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
